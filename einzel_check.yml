name: Einzel-Check (beliebige Ticker)

on:
  # Bewusst NUR manuell: externe Empfehlungen werden hier gegen
  # die eigene Systematik geprüft. Die bestehende B/C-Beobachtungsliste
  # wird vor jedem Lauf automatisch aus Google Drive geladen.
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker, durch Leerzeichen getrennt (EU mit Suffix, z.B. VOW3.DE)'
        required: true
        default: 'GM F CMI BWA PCAR'

jobs:
  einzel-check:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas google-auth-oauthlib google-api-python-client google-auth-httplib2 groq yfinance scipy google-genai requests

      # ----------------------------------------------------------
      # WICHTIG:
      # Vor dem Einzel-Check die bestehende B/C-Beobachtungsliste
      # aus Google Drive in den frischen GitHub-Runner laden.
      # Dadurch werden Titel aus einem früheren Check automatisch
      # erneut geprüft, auch wenn sie heute nicht manuell angegeben
      # wurden.
      # ----------------------------------------------------------
      - name: Beobachtungsliste aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python beobachtungsliste_sync.py

      - name: Ticker gegen alle drei Strategien prüfen
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python einzel_check.py ${{ github.event.inputs.ticker }}

      # Die von einzel_check.py aktualisierte JSON wird anschließend
      # wieder nach Google Drive gespiegelt.
      - name: Einzel-Check-Beobachtungsliste in Drive sichern
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python upload_to_drive.py
