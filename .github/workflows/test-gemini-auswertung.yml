name: Gemini Regressionstests

on:
  push:
    branches: [main]
    paths:
      - 'gemini_auswertung.py'
      - 'send_mail.py'
      - 'upload_to_drive.py'
      - 'tests/test_*gemini*.py'
      - 'tests/test_bitcoin_edelmetall_sections.py'
      - '.github/workflows/test-gemini-auswertung.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gemini_auswertung.py'
      - 'send_mail.py'
      - 'upload_to_drive.py'
      - 'tests/test_*gemini*.py'
      - 'tests/test_bitcoin_edelmetall_sections.py'
      - '.github/workflows/test-gemini-auswertung.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Testabhängigkeiten installieren
        run: python -m pip install google-genai google-auth google-api-python-client pytest
      - name: Syntax prüfen
        run: python -m compileall -q gemini_auswertung.py send_mail.py upload_to_drive.py tests
      - name: Alle Gemini-Regressionstests automatisch ausführen
        run: python -m pytest -v tests/test_*gemini*.py
      - name: Edelmetall-Abschnittstest ausführen
        run: python tests/test_bitcoin_edelmetall_sections.py gemini_auswertung.py
