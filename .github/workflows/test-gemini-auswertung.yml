
    
  
name: Schnelle Regressionstests – Gemini-Auswertung

on:
  push:
    branches: [main]
    paths:
      - 'gemini_auswertung.py'
      - 'tests/test_gemini_quellenperioden_gate.py'
      - 'tests/test_gemini_briefing_source_repair.py'
      - '.github/workflows/test-gemini-auswertung.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gemini_auswertung.py'
      - 'tests/test_gemini_quellenperioden_gate.py'
      - 'tests/test_gemini_briefing_source_repair.py'
      - '.github/workflows/test-gemini-auswertung.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Für Regressionstests benötigte Import-Abhängigkeiten installieren
        run: python -m pip install google-genai google-auth google-api-python-client
      - name: Syntax prüfen
        run: python -m py_compile gemini_auswertung.py tests/test_gemini_quellenperioden_gate.py tests/test_gemini_briefing_source_repair.py
      - name: Isolierte Regressionstests ausführen
        run: python -m unittest tests.test_gemini_quellenperioden_gate tests.test_gemini_briefing_source_repair -v

