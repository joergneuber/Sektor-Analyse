name: Gemini Regressionstests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Testabhängigkeiten installieren
        run: python -m pip install pytest pandas numpy requests

      - name: Syntax aller Python-Dateien prüfen
        run: python -m compileall -q .

      - name: Gesamten tests-Ordner ausführen
        run: python -m pytest -v tests/
