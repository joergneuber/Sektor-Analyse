name: Gemini Regressionstests

on:
  push:
    branches: [main]
    paths:
      - 'gemini_auswertung.py'
      - 'send_mail.py'
      - 'upload_to_drive.py'
      - 'tests/test_gemini_report_status.py'
      - 'tests/test_gemini_status_delivery.py'
      - 'tests/test_gemini_auswertung_regression.py'
      - '.github/workflows/test-gemini-auswertung.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gemini_auswertung.py'
      - 'send_mail.py'
      - 'upload_to_drive.py'
      - 'tests/test_gemini_report_status.py'
      - 'tests/test_gemini_status_delivery.py'
      - 'tests/test_gemini_auswertung_regression.py'
      - '.github/workflows/test-gemini-auswertung.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax prüfen
        run: python -m py_compile gemini_auswertung.py send_mail.py upload_to_drive.py tests/test_gemini_report_status.py tests/test_gemini_status_delivery.py tests/test_gemini_auswertung_regression.py
      - name: Schnelle Status-, Versand-, Upload- und Gemini-Regressionstests
        run: python -m pytest -v tests/test_gemini_report_status.py tests/test_gemini_status_delivery.py tests/test_gemini_auswertung_regression.py
