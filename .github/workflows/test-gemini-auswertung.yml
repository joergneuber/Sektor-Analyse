name: Gemini Regressionstests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Testabhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas==3.0.6 numpy==2.4.6 requests scipy alpaca-py exchange-calendars==4.13.2
          python -m pip install google-genai google-auth google-api-python-client

      - name: Installierte Kernversionen dokumentieren
        run: python -c "import sys, numpy, pandas, exchange_calendars; print('Python:', sys.version); print('NumPy:', numpy.__version__); print('Pandas:', pandas.__version__); print('exchange_calendars:', exchange_calendars.__version__)"

      - name: Syntax aller Python-Dateien prüfen
        run: python -m compileall -q .

      - name: Bitcoin-/Edelmetall-Test separat ausführen
        run: python tests/test_bitcoin_edelmetall_sections.py gemini_auswertung.py

      - name: Übrige Tests im tests-Ordner ausführen (Warnungen als Fehler)
        run: python -m pytest -v -W error tests/ --ignore=tests/test_bitcoin_edelmetall_sections.py
