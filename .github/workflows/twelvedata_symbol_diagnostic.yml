name: Twelve Data Symbol Diagnose

on:
  workflow_dispatch:

jobs:
  symbol-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Twelve Data symbol diagnostic
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python twelvedata_symbol_diagnostic.py
