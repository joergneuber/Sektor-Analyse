name: Test GSCPI New York Fed

on:
  workflow_dispatch:

jobs:
  test-gscpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Python-Abhängigkeiten installieren
        run: pip install requests pandas openpyxl

      - name: GSCPI Test
        run: python test_gscpi_nyfed.py
