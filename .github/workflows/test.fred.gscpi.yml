name: Test FRED GSCPI

on:
  workflow_dispatch:

jobs:
  test-gscpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: FRED API Test
        run: python test_fred_gscpi.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
