name: Positions-Alert Check

on:
  # Manueller Lauf: prueft sofort, unabhaengig vom Zeitfenster.
  workflow_dispatch:
  schedule:
    # GitHub Actions Cron arbeitet in UTC. Deshalb wird stundenweise zwischen
    # 06:00 und 21:00 UTC gestartet und im folgenden Schritt auf Europe/Berlin
    # geprueft. Dadurch bleibt das gewuenschte 2-Stunden-Raster auch bei der
    # Umstellung MEZ/MESZ korrekt:
    #
    # Sommerzeit: 08,10,12,14,16,18,20,22 Uhr Berlin
    # Winterzeit: 08,10,12,14,16,18,20,22 Uhr Berlin
    #
    # Nur jeder zweite Berliner Stundenlauf wird tatsaechlich ausgefuehrt.
    # Die ungeraden Zwischenlaeufe beenden sich nach dem Zeitcheck ohne
    # positionen_tracker.py aufzurufen.
    - cron: '17 6-21 * * 1-5'

jobs:
  stop-check:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Berliner Zeitfenster pruefen
        id: zeitfenster
        shell: bash
        run: |
          berlin_stunde=$(TZ=Europe/Berlin date +%H)
          echo "Berliner Uhrzeit: ${berlin_stunde}:17"
          if (( 10#$berlin_stunde >= 8 && 10#$berlin_stunde <= 22 && 10#$berlin_stunde % 2 == 0 )); then
            echo "run_tracker=true" >> "$GITHUB_OUTPUT"
            echo "Positionspruefung wird ausgefuehrt."
          else
            echo "run_tracker=false" >> "$GITHUB_OUTPUT"
            echo "Kein planmaessiger Lauf in diesem Zwischenfenster."
          fi

      - name: Python einrichten
        if: steps.zeitfenster.outputs.run_tracker == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        if: steps.zeitfenster.outputs.run_tracker == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas google-auth-oauthlib google-api-python-client google-auth-httplib2 yfinance

      - name: Offene Positionen prüfen und bei Stop/TP alerten
        if: steps.zeitfenster.outputs.run_tracker == 'true'
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python positionen_tracker.py
