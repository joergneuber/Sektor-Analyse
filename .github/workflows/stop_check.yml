name: Positions-Alert Check

on:
  # Manueller Lauf: prueft sofort, unabhaengig vom Zeitfenster.
  workflow_dispatch:
  schedule:
    # GitHub Actions Cron arbeitet in UTC. Deshalb wird stuendlich zwischen
    # 06:00 und 22:00 UTC gestartet und im folgenden Schritt auf Europe/Berlin
    # geprueft. Dadurch wird das gewuenschte stuendliche Raster zwischen
    # 08:00 und 22:00 Uhr Berlin bei der Umstellung MEZ/MESZ korrekt geprueft.
    - cron: '17 6-22 * * 1-5'

jobs:
  stop-check:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Berliner Zeitfenster pruefen
        id: zeitfenster
        shell: bash
        run: |
          berlin_stunde=$(TZ=Europe/Berlin date +%H)
          echo "Berliner Uhrzeit: ${berlin_stunde}:17"
          if (( 10#$berlin_stunde >= 8 && 10#$berlin_stunde <= 22 )); then
            echo "run_tracker=true" >> "$GITHUB_OUTPUT"
            echo "Positionspruefung wird ausgefuehrt."
          else
            echo "run_tracker=false" >> "$GITHUB_OUTPUT"
            echo "Kein Lauf innerhalb des Berliner Zeitfensters."
          fi

      - name: Python einrichten
        if: steps.zeitfenster.outputs.run_tracker == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        if: steps.zeitfenster.outputs.run_tracker == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas google-auth-oauthlib google-api-python-client google-auth-httplib2 yfinance scipy

      - name: Offene Positionen prüfen und bei Stop/TP alerten
        if: steps.zeitfenster.outputs.run_tracker == 'true'
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python positionen_tracker.py
