name: Portfolio Systemstart – historische Kursdaten exportieren

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Systemstart (YYYY-MM-DD)"
        required: true
        default: "2026-08-07"
        type: string
      end_date:
        description: "Bewertungsstichtag (YYYY-MM-DD)"
        required: true
        default: "2026-11-26"
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-system-start-price-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-historical-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read-only Export-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install "pandas<3.1" yfinance google-auth-oauthlib google-api-python-client google-auth-httplib2

      - name: Verifiziertes OHLCV-Release-Bundle wiederherstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
          NMM_ALLOW_OHLCV_LEGACY_MIGRATION: ${{ vars.NMM_ALLOW_OHLCV_LEGACY_MIGRATION }}
        run: bash scripts/restore_ohlcv_release_bundle.sh

      - name: Historische Kurse aus Produktions-Positionsmaster exportieren
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
        run: >-
          python export_portfolio_price_history.py
          --db historical_ohlcv.sqlite
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"
          --out-dir portfolio_price_export

      - name: Export-Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-system-start-prices-${{ github.run_id }}
          path: portfolio_price_export/
          if-no-files-found: warn
          retention-days: 30
