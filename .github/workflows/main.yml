
name: tägliche Analyse Sektoren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1-5'

concurrency:
  group: btc-50w-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-scripts:
    # Nur main darf den gemeinsamen OHLCV-Release und den strukturellen Cache schreiben.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      NODE_OPTIONS: "--no-deprecation"
      NMM_USE_HISTORICAL_OHLCV: "1"
      NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
      NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      # Das Thesenregister ist Lauf-zu-Lauf-State. Ein fehlender Cache ist
      # ausdrücklich kein leerer/abgeglichener Vorzustand; der erste Lauf
      # erzeugt nur einen Baseline-Snapshot und bleibt bis zum Folgelauf NICHT_FINAL.
      - name: Trading-Radar-Thesenregister wiederherstellen (Actions-Cache)
        id: trading-radar-thesen-cache-restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            .trading_radar_thesen.json
            .trading_radar_thesen.json.manifest.json
          key: trading-radar-thesen-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            trading-radar-thesen-${{ runner.os }}-${{ github.ref_name }}-

      # Cache ist der schnelle Pfad. Fehlt er oder ist sein Hash/Schema ungueltig,
      # wird das juengste unverfallene Run-Artifact desselben Branches geladen.
      - name: Trading-Radar-Thesenregister bei Bedarf aus Artifact wiederherstellen
        id: trading-radar-thesen-artifact-restore
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python trading_radar_thesen_persistence.py restore

      # Persistenter Firmennamen-Cache wird vor analyse.py wiederhergestellt;
      # dadurch muss der Hauptlauf bekannte Namen nicht erneut bei Yahoo anfragen.
      - name: Firmennamen-Cache wiederherstellen
        id: firma-name-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .firma_name_cache.json
          key: firma-name-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            firma-name-cache-${{ runner.os }}-${{ github.ref_name }}-

      # Automatische Läufe nur zulassen, wenn heute (UTC) noch kein
      # erfolgreicher manueller oder automatischer Lauf dieses Workflows existiert.
      # Fehlgeschlagene Läufe zählen nicht. Manuelle Starts umgehen diese Prüfung.
      - name: Erfolgreichen Tageslauf prüfen
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          previous_success="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            | jq -r --arg today "$today" --arg branch "$GITHUB_REF_NAME" --arg current "$GITHUB_RUN_ID" '
              .[] | .workflow_runs[]
              | select(.path == ".github/workflows/main.yml")
              | select(.head_branch == $branch)
              | select((.id | tostring) != $current)
              | select(.status == "completed" and .conclusion == "success")
              | select(.event == "schedule" or .event == "workflow_dispatch")
              | select(.updated_at[0:10] == $today)
              | .id
            ' | head -n 1)"
          if [ -n "$previous_success" ]; then
            echo "Heute (${today} UTC) wurde bereits ein erfolgreicher Lauf abgeschlossen (Run ${previous_success})."
            echo "Automatischer Lauf wird abgebrochen; manuelle Starts bleiben erlaubt."
            gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
            exit 0
          fi
          echo "Heute (${today} UTC) liegt noch kein erfolgreicher Lauf vor. Automatischer Lauf darf fortfahren."

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Die Datenvertragstests importieren historische OHLCV-Module und deren
      # Laufzeitabhängigkeiten. Diese müssen vor dem Pflicht-Regressionstest
      # installiert sein; bei Testfehlern wird weiterhin vor produktiven Schritten abgebrochen.
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py==0.45.0 "pandas<3.1" exchange-calendars google-auth-oauthlib google-api-python-client google-auth-httplib2 groq yfinance scipy google-genai requests lxml xlrd cme-fedwatch openpyxl

      - name: Alpaca-Split-Adjustment-Vertrag pruefen
        run: python -m unittest tests.test_alpaca_split_adjustment_contract

      # Pflicht-Regression: Trading-Radar-Datenvertrag vor produktiven Schritten prüfen.
      - name: Trading-Radar Datenvertrag Regressionstest
        id: trading-radar-contract
        run: python -m unittest discover -s tests -p "test_trading_radar_data_contract.py"

      # Neue deterministische Markt-First- und Ereignis-/OHLCV-Regressionen.
      - name: Pytest fuer Markt-First-Integration installieren
        run: python -m pip install pytest

      - name: Trading-Radar Markt-First-Qualitätsregression
        id: trading-radar-market-first
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_trading_radar_market_first.py tests/test_trading_radar_market_first_prompt.py tests/test_trading_radar_production_market_first_integration.py

      # Pflicht-Integrationstest: technische Fehlerkette und Release-Vertrag
      # müssen vor den produktiven Analyse- und Publikationsschritten bestehen.
      - name: Trading-Radar technische Fehlerkette – Pflicht-Integrationstest
        id: trading-radar-failure-chain
        run: python -m unittest tests.test_trading_radar_failure_chain_integration tests.test_trading_radar_release_contract

      # BTC 50W-SMA: persistent state so a weekend cross is delivered by
      # the first regular Monday analysis and is not re-reported later.
      - name: BTC 50W-SMA State wiederherstellen
        id: btc-50w-state-restore
        uses: actions/cache/restore@v5
        with:
          path: .btc_50w_sma_state
          key: btc-50w-sma-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            btc-50w-sma-state-${{ runner.os }}-${{ github.ref_name }}-

      # Der GitHub-Release-Asset ist die einzige dauerhafte OHLCV-Speicherung.
      # Fuer OHLCV wird bewusst kein Actions-Cache wiederhergestellt: Er waere
      # gegenueber dem Release nicht autoritativ und wuerde nur einen zusaetzlichen
      # grossen Download verursachen. Die DB bleibt getrennt vom market_cache.json.

      - name: Historische OHLCV-Datenbank und dynamisches Universum aus Dauerarchiv wiederherstellen
        env:
          GH_TOKEN: ${{ github.token }}
          NMM_ALLOW_OHLCV_UNIVERSE_BOOTSTRAP: ${{ vars.NMM_ALLOW_OHLCV_UNIVERSE_BOOTSTRAP }}
          NMM_ALLOW_OHLCV_LEGACY_MIGRATION: ${{ vars.NMM_ALLOW_OHLCV_LEGACY_MIGRATION }}
        run: |
          set -euo pipefail
          # Das Release ist die einzige dauerhafte Quelle. Lokale Reste duerfen
          # keinen nicht verifizierten OHLCV-Stand in den Lauf einschleusen.
          rm -f historical_ohlcv.sqlite historical_ohlcv.sqlite-wal historical_ohlcv.sqlite-shm historical_ohlcv.sqlite-journal historical_ohlcv_universe.json
          release_list="$(gh release list --limit 1000 --json tagName)"
          printf '%s' "$release_list" | jq -e 'type == "array"' >/dev/null
          if printf '%s' "$release_list" | jq -e 'any(.[]; .tagName == "historical-ohlcv")' >/dev/null; then
            release_assets="$(bash scripts/get_gh_release_assets.sh "$GITHUB_REPOSITORY" historical-ohlcv)"
            printf '%s' "$release_assets" | jq -e 'type == "array"' >/dev/null
            release_asset_count="$(printf '%s' "$release_assets" | jq 'length')"
            release_bundle_count="$(printf '%s' "$release_assets" | jq '[.[] | select(.name | test("^historical_ohlcv_bundle_[A-Za-z0-9_.-]+\\.zip$"))] | length')"
            legacy_db_present="$(printf '%s' "$release_assets" | jq -r 'any(.[]; .name == "historical_ohlcv.sqlite")')"
            legacy_universe_present="$(printf '%s' "$release_assets" | jq -r 'any(.[]; .name == "historical_ohlcv_universe.json")')"
            echo "::notice::OHLCV_RELEASE_METADATA | uploaded_assets=${release_asset_count} | bundles=${release_bundle_count} | legacy_db=${legacy_db_present} | legacy_universe=${legacy_universe_present} | legacy_migration_opt_in=${NMM_ALLOW_OHLCV_LEGACY_MIGRATION:-0}"
            MAX_RELEASE_ASSET_BYTES=$((2 * 1024 * 1024 * 1024 - 1))
            mapfile -t bundle_names < <(printf '%s' "$release_assets" | jq -r '[.[] | select(.name | test("^historical_ohlcv_bundle_[A-Za-z0-9_.-]+\\.zip$"))] | sort_by([.created_at, .name]) | reverse | .[].name')
            restored=0
            for bundle_name in "${bundle_names[@]}"; do
              remote_digest="$(printf '%s' "$release_assets" | jq -r --arg name "$bundle_name" '[.[] | select(.name == $name)][0].digest // empty')"
              remote_size="$(printf '%s' "$release_assets" | jq -r --arg name "$bundle_name" '[.[] | select(.name == $name)][0].size // empty')"
              if ! [[ "$remote_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] ||
                 ! [[ "$remote_size" =~ ^[0-9]+$ ]] ||
                 (( remote_size > MAX_RELEASE_ASSET_BYTES )); then
                echo "::warning::Bundle ${bundle_name} besitzt keinen gueltigen Digest oder verletzt die GitHub-Groessengrenze (<2 GiB); Asset wird nicht verwendet."
                continue
              fi
              rm -f "$bundle_name"
              if ! gh release download historical-ohlcv --pattern "$bundle_name" --dir . --clobber; then
                echo "::warning::OHLCV-Bundle ${bundle_name} konnte nicht geladen werden; pruefe den vorherigen Snapshot."
                rm -f "$bundle_name"
                continue
              fi
              local_size="$(stat -c '%s' "$bundle_name")"
              local_sha="$(sha256sum "$bundle_name" | awk '{print $1}')"
              if (( local_size > MAX_RELEASE_ASSET_BYTES )) ||
                 [ "$local_size" != "$remote_size" ] ||
                 [ "$local_sha" != "${remote_digest#sha256:}" ]; then
                echo "::warning::Remote-Digest und heruntergeladene Datei von ${bundle_name} stimmen nicht ueberein; Asset wird uebersprungen."
                rm -f "$bundle_name"
                continue
              fi
              if python ohlcv_release_bundle.py extract --bundle "$bundle_name" --db historical_ohlcv.sqlite --universe historical_ohlcv_universe.json; then
                restored=1
                echo "OHLCV-Release-Verifikation PASS: gemeinsamer Snapshot ${bundle_name}"
                rm -f "$bundle_name"
                break
              fi
              echo "::warning::OHLCV-Bundle ${bundle_name} ist inhaltlich ungueltig; pruefe den vorherigen Snapshot."
              rm -f "$bundle_name"
            done

            # Die getrennten Legacy-Assets koennen keinen gemeinsamen Snapshot
            # beweisen. Ihre Nutzung erfordert deshalb einen ausdruecklichen
            # einmaligen Betreiberentscheid und korrekte Remote-Digests beider Assets.
            if [ "$restored" -ne 1 ] && [ "${NMM_ALLOW_OHLCV_LEGACY_MIGRATION:-0}" = "1" ]; then
              legacy_db_digest="$(printf '%s' "$release_assets" | jq -r '[.[] | select(.name == "historical_ohlcv.sqlite")][0].digest // empty')"
              legacy_universe_digest="$(printf '%s' "$release_assets" | jq -r '[.[] | select(.name == "historical_ohlcv_universe.json")][0].digest // empty')"
              if [[ "$legacy_db_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] && [[ "$legacy_universe_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
                legacy_db_size="$(printf '%s' "$release_assets" | jq -r '[.[] | select(.name == "historical_ohlcv.sqlite")][0].size // empty')"
                legacy_universe_size="$(printf '%s' "$release_assets" | jq -r '[.[] | select(.name == "historical_ohlcv_universe.json")][0].size // empty')"
                legacy_db_updated="$(printf '%s' "$release_assets" | jq -r '[.[] | select(.name == "historical_ohlcv.sqlite")][0].updated_at // empty')"
                legacy_universe_updated="$(printf '%s' "$release_assets" | jq -r '[.[] | select(.name == "historical_ohlcv_universe.json")][0].updated_at // empty')"
                if ! [[ "$legacy_db_size" =~ ^[0-9]+$ ]] ||
                   ! [[ "$legacy_universe_size" =~ ^[0-9]+$ ]] ||
                   (( legacy_db_size > MAX_RELEASE_ASSET_BYTES || legacy_universe_size > MAX_RELEASE_ASSET_BYTES )); then
                  echo "::error::Legacy-Assets besitzen keine gültigen Größenangaben oder überschreiten die GitHub-Grenze (<2 GiB)."
                  exit 1
                fi
                if [ -z "$legacy_db_updated" ] || [ -z "$legacy_universe_updated" ]; then
                  echo "::error::Legacy-Assets besitzen keine Upload-Zeitstempel; Migration wird abgebrochen."
                  exit 1
                fi
                legacy_db_epoch="$(date -d "$legacy_db_updated" +%s)"
                legacy_universe_epoch="$(date -d "$legacy_universe_updated" +%s)"
                legacy_asset_skew=$((legacy_db_epoch - legacy_universe_epoch))
                legacy_asset_skew=${legacy_asset_skew#-}
                if [ "$legacy_asset_skew" -gt 120 ]; then
                  echo "::error::Legacy-Assets liegen mehr als 120 Sekunden auseinander; Migration wird abgebrochen."
                  exit 1
                fi
                gh release download historical-ohlcv --pattern historical_ohlcv.sqlite --dir . --clobber
                gh release download historical-ohlcv --pattern historical_ohlcv_universe.json --dir . --clobber
                local_db_size="$(stat -c '%s' historical_ohlcv.sqlite)"
                local_universe_size="$(stat -c '%s' historical_ohlcv_universe.json)"
                local_db_sha="$(sha256sum historical_ohlcv.sqlite | awk '{print $1}')"
                local_universe_sha="$(sha256sum historical_ohlcv_universe.json | awk '{print $1}')"
                if [ "$local_db_size" = "$legacy_db_size" ] &&
                   [ "$local_universe_size" = "$legacy_universe_size" ] &&
                   [ "$local_db_sha" = "${legacy_db_digest#sha256:}" ] &&
                   [ "$local_universe_sha" = "${legacy_universe_digest#sha256:}" ]; then
                  python ohlcv_release_bundle.py verify-files --db historical_ohlcv.sqlite --universe historical_ohlcv_universe.json
                  restored=1
                  echo "::warning::Legacy-OHLCV-Migration explizit freigegeben. Die getrennten Assets koennen keinen gemeinsamen Transaktionsstand beweisen; der naechste erfolgreiche Lauf erstellt ein gemeinsames Bundle."
                else
                  echo "::error::Legacy-Asset-Digest stimmt nicht mit dem heruntergeladenen Inhalt ueberein."
                  exit 1
                fi
              else
                echo "::error::Legacy-Migration freigegeben, aber Remote-Digests der beiden Assets fehlen oder sind ungueltig."
                exit 1
              fi
            fi

            if [ "$restored" -ne 1 ]; then
              # Ein Bootstrap ist ausschliesslich fuer einen wirklich leeren
              # OHLCV-Release zulaessig. Vorhandene Legacy-Assets oder Bundle-
              # Assets duerfen nicht durch einen Bootstrap umgangen werden:
              # sie koennen einen noch zu rettenden oder nur defekten Bestand
              # repraesentieren. In diesem Fall muss der Restore fehlschlagen.
              if [ "$release_bundle_count" -gt 0 ] ||
                 [ "$legacy_db_present" = "true" ] ||
                 [ "$legacy_universe_present" = "true" ]; then
                echo "::error::OHLCV-Assets sind im Release vorhanden, aber kein gueltiger Snapshot konnte wiederhergestellt werden. Bootstrap ist zum Schutz der vorhandenen Historie gesperrt."
                exit 1
              fi
              if [ "${NMM_ALLOW_OHLCV_UNIVERSE_BOOTSTRAP:-0}" = "1" ]; then
                rm -f historical_ohlcv.sqlite historical_ohlcv_universe.json
                echo "::warning::Das OHLCV-Release enthaelt keine Bundle- oder Legacy-Assets; der ausdruecklich freigegebene Erstaufbau ist aktiviert."
              else
                echo "::error::Kein remote-digest-verifiziertes gemeinsames OHLCV-Bundle und kein ausdruecklich freigegebenes Legacy-Paar. Bootstrap ist gesperrt."
                exit 1
              fi
            fi
          elif [ "${NMM_ALLOW_OHLCV_UNIVERSE_BOOTSTRAP:-0}" = "1" ]; then
            echo "::warning::OHLCV-Release existiert noch nicht; expliziter Erstaufbau ist aktiviert."
          else
            echo "::error::Das OHLCV-Release existiert nicht. Erstaufbau ist gesperrt, bis Repository Variable NMM_ALLOW_OHLCV_UNIVERSE_BOOTSTRAP=1 bewusst gesetzt wird."
            exit 1
          fi

      # Einzel-Check-Runs liefern ausschliesslich Pending-Queue-Artifacts.
      # Der Import ist idempotent; Run-Receipts liegen in SQLite und werden
      # mit dem authoritative Bundle persistiert. Queue-Probleme blockieren
      # nicht die Diagnose, verhindern aber den FINAL-Status.
      - name: OHLCV Pending-Queues aus Einzel-Checks importieren
        id: ohlcv-pending-queue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
        run: python historical_ohlcv_pending_queue.py import --lookback-days 90

      - name: Historische OHLCV-Datenbank aktualisieren
        id: ohlcv-pre-scan-update
        continue-on-error: true
        env:
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
          NMM_USE_HISTORICAL_OHLCV: "1"
        run: python historical_ohlcv.py update --strict

      - name: Historische OHLCV Coverage prüfen
        id: ohlcv-pre-scan-coverage
        continue-on-error: true
        env:
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
        run: python historical_ohlcv.py coverage --summary

      # Gemeinsamer Markt-Datenstand fuer alle Python-Prozesse dieses Jobs.
      # Der Cache bleibt bewusst job-lokal: kein alter Run darf als aktueller
      # Primärstand in einen neuen Lauf hineinwirken.
      - name: Gemeinsamen Marktdaten-Cache initialisieren
        run: rm -f market_cache.json market_cache.json.lock

      - name: Historische OHLCV Regressionstests
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_historical_ohlcv.py
          tests/test_historical_ohlcv_pending_queue.py
          tests/test_offene_positionen_check_history_source.py
          tests/test_ohlcv_release_bundle.py
          tests/test_ohlcv_release_consumers.py
          tests/test_workflow_dynamic_universe.py

      # ============================================================
      # EXTERNER DATENQUELLEN-TEST – GDELT + LME
      # Diagnose/Freigabeprüfung im echten GitHub Runner.
      # Zunächst bewusst nicht blockierend.
      # ============================================================

      - name: GDELT GKG Runner-Test
        continue-on-error: true
        run: python tests/test_gdelt_gkg_runner.py

      - name: LME Quellen Runner-Test
        continue-on-error: true
        run: python tests/test_lme_sources_runner.py

      - name: Makro-Architektur Regressionstest
        run: python tests/test_macro_architecture.py

      - name: ForexFactory Produktions-Normalizer Regressionstest
        run: python tests/test_forexfactory_production.py

      # Coverage- und Risikonachweis müssen vor dem produktiven Lauf regressionsgeprüft sein.
      - name: Trading-Radar Snapshot-/Risiko-Regressionstest
        run: python -m unittest tests.test_trading_radar_run_evidence tests.test_trading_radar_report_gate

      # Laufweiter Snapshot vor dem Positionstracker: bekannte Produktionspfade
      # plus Quelleninventar über CSV/TSV/JSON/XLSX/XLS/TXT/MD. Kategorien werden
      # getrennt bewertet; AVAILABLE ist nur bei vollständiger Dreifachabdeckung zulässig.
      - name: Trading-Radar Portfolio-/Risiko-Snapshot Start
        run: python trading_radar_run_evidence.py start

      - name: Offene Positionen aktualisieren
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python positionen_tracker.py

      # Der Tracker hat die aktuelle Offene_Positionen.csv gerade aus Drive
      # geladen/aktualisiert. Diese offene Positionenliste wird vor dem
      # technischen Check verbindlich im persistenten OHLCV-Universum registriert.
      - name: Offene Positionen ins historische OHLCV-Universum übernehmen
        id: ohlcv-pre-scan-position-sync
        continue-on-error: true
        env:
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
          NMM_USE_HISTORICAL_OHLCV: "1"
        run: python historical_ohlcv.py sync-open-positions --positions-file Offene_Positionen.csv

      # ============================================================
      # OFFENE POSITIONEN + TECHNISCHER CHECK
      # Die alte Offene_Positionen.csv bleibt Backend-Datenquelle des
      # Trackers. Fuer die Nutzer-/Gemini-Ausgabe ist ab hier
      # ausschliesslich die neue Check-Datei massgeblich.
      # ============================================================
      - name: Offene Positionen + Check erstellen und in Drive aktualisieren
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python offene_positionen_check.py

      # Nach dem Provider-Fallback muessen alle offenen Positionen mit einer
      # aktuellen, vom Quality Gate freigegebenen Historie in SQLite vorliegen.
      - name: Offene OHLCV-Historien abschliessend qualitaetspruefen
        id: ohlcv-pre-scan-position-verify
        continue-on-error: true
        env:
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
          NMM_USE_HISTORICAL_OHLCV: "1"
        run: python historical_ohlcv.py verify-open-positions --positions-file Offene_Positionen.csv

      # Live-Benchmark gegen iShares Core MSCI World (EUNL.DE),
      # Stichtag 07.08.2026. Kein Backtest: verarbeitet ausschließlich
      # die echte Positionen-Historie aus Offene_Positionen.csv.
      - name: Live-Benchmark gegen MSCI World aktualisieren
        run: python performance_benchmark.py

      - name: Einzel-Check-Beobachtungsliste aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python beobachtungsliste_sync.py

      - name: Beobachtungsliste täglich erneut prüfen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python einzel_check.py --beobachtungsliste

      # HEBELTRADER: letzter um 09:30 Europe/Berlin erfolgreich verarbeiteter
      # Einzel-Check wird aus Drive geladen. Der nächste Hauptlauf verwendet
      # immer den letzten erfolgreichen Stand – unabhängig davon, ob der
      # Hauptlauf automatisch oder manuell gestartet wurde.
      - name: Letzten HEBELTRADER-Einzelcheck aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python hebeltrader_sync.py

      - name: Analyse ausführen
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python analyse.py

      - name: Firmennamen-Cache dauerhaft speichern
        if: ${{ always() && hashFiles('.firma_name_cache.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .firma_name_cache.json
          key: firma-name-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # State erst NACH erfolgreicher analyse.py sichern. So kann ein
      # Cross nicht als "gemeldet" verloren gehen, falls die Analyse vorher
      # abbricht. Benchmark-Snapshots konsumieren den Cross ausdrücklich nicht.
      - name: BTC 50W-SMA State speichern
        if: ${{ success() && hashFiles('.btc_50w_sma_state/state.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .btc_50w_sma_state
          key: btc-50w-sma-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Trendwende-Scan ausführen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python trendwende_scanner.py

      - name: Edelmetalle-Scan ausführen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python edelmetalle_scanner.py

      - name: Short-Scan nachholen falls heute nicht gelaufen
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python short_scan_catchup.py

      - name: Langfrist-Scan nachholen falls diese Woche nicht gelaufen
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python langfrist_scan_catchup.py

      # ============================================================
      # MAKRO-DATENPAKET
      # Cache-Version bewusst auf v5 erhöht.
      # Dadurch wird der bisherige v4-Cache NICHT übernommen.
      # ============================================================

      - name: Persistenten Makro-Cache wiederherstellen
        id: macro-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .macro_cache
          key: nmm-macro-cache-v6-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nmm-macro-cache-v6-${{ runner.os }}-

      - name: Makro-Datenpaket erstellen
        continue-on-error: true
        run: python makro_szenario.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Der Makro-Prozess darf den von analyse.py erzeugten Shared-Stand
          # auch nach laengeren Vorstufen noch verwenden. Der Cache wurde zu
          # Job-Beginn geleert und enthaelt daher nur diesen aktuellen Lauf.
          NMM_MARKET_CACHE_TTL_MINUTES: "120"

      - name: Persistenten Makro-Cache explizit speichern
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .macro_cache
          key: nmm-macro-cache-v6-${{ runner.os }}-${{ github.run_id }}

      - name: Gemeinsamen Marktdaten-Cache diagnostizieren
        if: always()
        run: |
          echo "SHARED_MARKET_CACHE_FILE_EXISTS=$(test -f market_cache.json && echo YES || echo NO)"
          if [ -f market_cache.json ]; then
            echo "SHARED_MARKET_CACHE_SIZE=$(wc -c < market_cache.json)"
          fi

      - name: Cache-Diagnose
        if: always()
        run: |
          echo "MACRO_CACHE_RESTORE_HIT=${{ steps.macro-cache-restore.outputs.cache-hit }}"
          echo "MACRO_CACHE_DIR_EXISTS=$(test -d .macro_cache && echo YES || echo NO)"
          echo "MACRO_CACHE_FILE_EXISTS=$(test -f .macro_cache/macro_cache.json && echo YES || echo NO)"

          if [ -f .macro_cache/macro_cache.json ]; then
            echo "MACRO_CACHE_SIZE=$(wc -c < .macro_cache/macro_cache.json)"
          fi

      # ============================================================
      # STRUKTUR-TRENDS (C)
      # Eigenständiger struktureller Datenbaustein im Hauptlauf.
      # ============================================================

      - name: Altes Struktur-Trend-Briefing entfernen
        run: rm -f Struktur_Trend_Briefing\(*\).txt Struktur_Trend_Briefing*.txt

      - name: Struktur-Trends aktualisieren
        id: struktur-trends
        continue-on-error: true
        run: python struktur_trends.py

      - name: Struktur-Trends Cache speichern
        if: steps.struktur-trends.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cache_tmp="$(mktemp)"
          cp struktur_trends_cache.json "$cache_tmp"
          pushed=false
          for attempt in 1 2 3; do
            echo "Structural-trends cache push attempt ${attempt}/3"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp "$cache_tmp" struktur_trends_cache.json
            git add struktur_trends_cache.json
            if git diff --cached --quiet; then
              echo "No structural trends cache changes to commit."
              pushed=true
              break
            fi
            git commit -m "Update structural trends cache"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            echo "Remote branch changed during push; retrying against the new remote head."
          done
          rm -f "$cache_tmp"
          if [ "$pushed" != true ]; then
            echo "ERROR: structural trends cache could not be pushed after 3 attempts."
            exit 1
          fi

      # Bei einem fehlgeschlagenen C-Lauf darf kein teilweise erzeugtes
      # Briefing als scheinbar aktueller C-Input an Gemini gelangen.
      - name: Struktur-Trend-Briefing bei C-Fehler entfernen
        if: steps.struktur-trends.outcome != 'success'
        run: rm -f Struktur_Trend_Briefing\(*\).txt Struktur_Trend_Briefing*.txt

      # ============================================================
      # GEMINI-AUSWERTUNG
      # ============================================================

      # Bitcoin Trading DE: State nur für den regulären Hauptlauf.
      # Die Benchmark-Workflows lesen diesen State nicht schreibend.
      - name: Bitcoin Trading DE State wiederherstellen
        id: btc-youtube-state-restore
        uses: actions/cache/restore@v5
        with:
          path: .bitcoin_youtube_state
          key: btc-youtube-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            btc-youtube-state-${{ runner.os }}-${{ github.ref_name }}-

      # Zusätzlicher State ausschließlich für die Gold-/Silber-Erweiterung.
      - name: Gold/Silber YouTube State wiederherstellen
        id: metals-youtube-state-restore
        uses: actions/cache/restore@v5
        with:
          path: .youtube_market_sources_state
          key: metals-youtube-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            metals-youtube-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Externe YouTube-Marktquellen vorbereiten
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_market_sources.py

      - name: Gemini Chunking/Resume Regressionstest
        run: python tests/test_gemini_chunking_reparatur.py

      - name: Gemini Status-/Versand-Regressionstest
        run: python tests/test_gemini_status_delivery.py

      # Resume-Zustand erfolgreicher Gemini-Splits ueberlebt kurzlebige GitHub-Runner.
      # Der Python-Code prueft vor Wiederverwendung den Fingerabdruck aller Quellen.
      - name: Gemini Split Resume wiederherstellen
        id: gemini-split-resume-restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            .gemini_request_split_resume.json
            .gemini_request_split_resume_done
          key: gemini-split-resume-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gemini-split-resume-${{ runner.os }}-${{ github.ref_name }}-

      # Finaler Queue-Checkpoint NACH den Scannern: waehrend des Hauptlaufs
      # neu eingetroffene Ticker werden gespeichert, erzwingen aber NICHT_FINAL,
      # weil die Scanner sie erst im naechsten Hauptlauf auswerten koennen.
      - name: OHLCV Pending-Queues nach Scannerläufen erneut importieren
        id: ohlcv-pending-queue-final
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
        run: python historical_ohlcv_pending_queue.py import --lookback-days 90 --after-scanners

      - name: Finale OHLCV-Synchronisierung, Coverage und Positionsprüfung
        id: ohlcv-final-sync
        if: always()
        continue-on-error: true
        env:
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
          NMM_USE_HISTORICAL_OHLCV: "1"
        run: |
          set +e
          python historical_ohlcv.py update --strict
          update_rc=$?
          python historical_ohlcv.py coverage --summary
          coverage_rc=$?
          python historical_ohlcv.py verify-open-positions --positions-file Offene_Positionen.csv
          positions_rc=$?
          set -e
          if [ -s historical_ohlcv.sqlite ] && [ -s historical_ohlcv_universe.json ]; then
            if [ "$update_rc" -eq 0 ] && [ "$coverage_rc" -eq 0 ] && [ "$positions_rc" -eq 0 ]; then
              sync_status="complete"
            else
              sync_status="partial"
            fi
          else
            sync_status="failed"
          fi
          echo "status=${sync_status}" >> "$GITHUB_OUTPUT"
          echo "update_exit=${update_rc}" >> "$GITHUB_OUTPUT"
          echo "coverage_exit=${coverage_rc}" >> "$GITHUB_OUTPUT"
          echo "positions_exit=${positions_rc}" >> "$GITHUB_OUTPUT"
          echo "OHLCV_FINAL_SYNC_STATUS=${sync_status}|update=${update_rc}|coverage=${coverage_rc}|positions=${positions_rc}"

      - name: Finale OHLCV-Datenbank und Universum atomar im Dauerarchiv sichern und verifizieren
        id: ohlcv-final-release-save
        if: ${{ always() && hashFiles('historical_ohlcv.sqlite') != '' && hashFiles('historical_ohlcv_universe.json') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s historical_ohlcv.sqlite
          test -s historical_ohlcv_universe.json
          # Vor jedem Release-Update: vollstaendiger SQLite-Integritaetscheck
          # und konsistenter Snapshot ueber SQLite Backup API.
          bundle_name="historical_ohlcv_bundle_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.zip"
          python ohlcv_release_bundle.py create \
            --db historical_ohlcv.sqlite \
            --universe historical_ohlcv_universe.json \
            --output "$bundle_name"
          python ohlcv_release_bundle.py verify --bundle "$bundle_name"
          MAX_RELEASE_ASSET_BYTES=$((2 * 1024 * 1024 * 1024 - 1))
          bundle_size="$(stat -c '%s' "$bundle_name")"
          if ! [[ "$bundle_size" =~ ^[0-9]+$ ]] || (( bundle_size > MAX_RELEASE_ASSET_BYTES )); then
            echo "::error::OHLCV-Bundle ist ${bundle_size} Bytes groß; GitHub Release Assets müssen kleiner als 2 GiB sein. Upload wird vorab verhindert."
            exit 1
          fi
          if ! gh release view historical-ohlcv >/dev/null 2>&1; then
            gh release create historical-ohlcv --title "Historical OHLCV Database" --notes "Einziger dauerhafter Speicher fuer gemeinsame, integritaetsgepruefte OHLCV-Snapshots."
          fi
          # Unveraenderlicher Asset-Name. Vorhandene Snapshots werden erst
          # nach Remote-Digest UND inhaltlicher Bundle-Pruefung bereinigt.
          gh release upload historical-ohlcv "$bundle_name"

          # GitHub kann den Asset-Digest kurz nach Upload noch nicht ausliefern.
          # In diesem Fall wird abgebrochen; es wird nichts Altes geloescht.
          local_sha="$(sha256sum "$bundle_name" | awk '{print $1}')"
          remote_digest=""
          for attempt in 1 2 3 4 5; do
            release_assets="$(bash scripts/get_gh_release_assets.sh "$GITHUB_REPOSITORY" historical-ohlcv)"
            printf '%s' "$release_assets" | jq -e 'type == "array"' >/dev/null
            MAX_RELEASE_ASSET_BYTES=$((2 * 1024 * 1024 * 1024 - 1))
            remote_digest="$(printf '%s' "$release_assets" | jq -r --arg name "$bundle_name" '[.[] | select(.name == $name)][0].digest // empty')"
            if [[ "$remote_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
              break
            fi
            sleep 2
          done
          if ! [[ "$remote_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || [ "$local_sha" != "${remote_digest#sha256:}" ]; then
            echo "::error::Remote-SHA-256 des neuen OHLCV-Bundles fehlt oder stimmt nicht ueberein. Vorherige Assets bleiben unangetastet."
            exit 1
          fi
          python ohlcv_release_bundle.py verify --bundle "$bundle_name"
          echo "OHLCV-Release-Verifikation PASS: $bundle_name"

          # Vor jeder Bereinigung ALLE Kandidaten anhand Remote-Digest und
          # Bundle-Manifest/SQLite-Integritaet pruefen. Es bleiben die zwei
          # neuesten gueltigen Bundles, nicht bloss die zwei neuesten Dateinamen.
          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT
          mapfile -t all_bundle_names < <(printf '%s' "$release_assets" | jq -r '[.[] | select(.name | test("^historical_ohlcv_bundle_[A-Za-z0-9_.-]+\\.zip$"))] | sort_by([.created_at, .name]) | reverse | .[].name')
          valid_bundle_names=()
          for asset_name in "${all_bundle_names[@]}"; do
            asset_digest="$(printf '%s' "$release_assets" | jq -r --arg name "$asset_name" '[.[] | select(.name == $name)][0].digest // empty')"
            asset_size="$(printf '%s' "$release_assets" | jq -r --arg name "$asset_name" '[.[] | select(.name == $name)][0].size // empty')"
            if ! [[ "$asset_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]] ||
               ! [[ "$asset_size" =~ ^[0-9]+$ ]] ||
               (( asset_size > MAX_RELEASE_ASSET_BYTES )); then
              echo "::warning::Bundle ${asset_name} ohne gueltigen Remote-Digest oder oberhalb der GitHub-Groessengrenze wird nicht als Rollback-Stand gezaehlt."
              continue
            fi
            if ! gh release download historical-ohlcv --pattern "$asset_name" --dir "$validation_dir" --clobber; then
              echo "::warning::Bundle ${asset_name} konnte zur Bereinigung nicht geladen werden."
              continue
            fi
            downloaded_size="$(stat -c '%s' "$validation_dir/$asset_name")"
            downloaded_sha="$(sha256sum "$validation_dir/$asset_name" | awk '{print $1}')"
            if (( downloaded_size > MAX_RELEASE_ASSET_BYTES )) ||
               [ "$downloaded_size" != "$asset_size" ] ||
               [ "$downloaded_sha" != "${asset_digest#sha256:}" ]; then
              echo "::warning::Remote-Digest-Abweichung bei ${asset_name}; Asset wird nicht als gueltiger Rollback-Stand gezaehlt."
              rm -f "$validation_dir/$asset_name"
              continue
            fi
            if python ohlcv_release_bundle.py verify --bundle "$validation_dir/$asset_name" >/dev/null; then
              valid_bundle_names+=("$asset_name")
            else
              echo "::warning::Inhaltlich ungueltiges Bundle ${asset_name}; Asset wird nicht als Rollback-Stand gezaehlt."
            fi
            rm -f "$validation_dir/$asset_name"
          done

          if [ "${#valid_bundle_names[@]}" -ge 2 ]; then
            keep_bundle_names=("${valid_bundle_names[@]:0:2}")
            for asset_name in "${all_bundle_names[@]}"; do
              keep=0
              for keep_name in "${keep_bundle_names[@]}"; do
                [ "$asset_name" != "$keep_name" ] || keep=1
              done
              if [ "$keep" -eq 0 ]; then
                gh release delete-asset historical-ohlcv "$asset_name" --yes
              fi
            done
            # Legacy-Assets erst entfernen, wenn zwei unabhaengig verifizierte
            # Bundle-Versionen als aktueller und Rollback-Stand erhalten bleiben.
            for legacy_asset in historical_ohlcv.sqlite historical_ohlcv_universe.json; do
              if printf '%s' "$release_assets" | jq -e --arg name "$legacy_asset" 'any(.[]; .name == $name)' >/dev/null; then
                gh release delete-asset historical-ohlcv "$legacy_asset" --yes
              fi
            done
            echo "OHLCV-Release-Bereinigung PASS: zwei inhaltlich und remote verifizierte Bundles bleiben erhalten."
          else
            echo "::warning::Nur ${#valid_bundle_names[@]} gueltige Bundle-Version(en) vorhanden. Alte Bundles und Legacy-Assets bleiben vollstaendig erhalten."
          fi

      - name: Trading-Radar-Laufmarker setzen
        run: |
          rm -f Gemini_Fallback_Status*.txt
          rm -f Trading_Radar_Status*.txt
          touch .trading_radar_run_started

      - name: Trading-Radar erstellen
        id: trading-radar
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          OHLCV_FINAL_SYNC: ${{ steps.ohlcv-final-sync.outputs.status || steps.ohlcv-final-sync.outcome || 'missing' }}
          OHLCV_RELEASE_PERSISTENCE: ${{ steps.ohlcv-final-release-save.outcome || 'missing' }}
          OHLCV_QUEUE_IMPORT: ${{ steps.ohlcv-pending-queue-final.outputs.status || steps.ohlcv-pending-queue-final.outcome || 'missing' }}
          OHLCV_PRE_SCAN_UPDATE: ${{ steps.ohlcv-pre-scan-update.outcome || 'missing' }}
          OHLCV_PRE_SCAN_COVERAGE: ${{ steps.ohlcv-pre-scan-coverage.outcome || 'missing' }}
          OHLCV_PRE_SCAN_POSITION_SYNC: ${{ steps.ohlcv-pre-scan-position-sync.outcome || 'missing' }}
          OHLCV_PRE_SCAN_POSITION_VERIFY: ${{ steps.ohlcv-pre-scan-position-verify.outcome || 'missing' }}
        run: python Trading_Radar_Alleinauswertung.py

      # Auch bei NICHT_FINAL sichern: der erzeugte Registerstand wird zum
      # nachvollziehbaren Vorzustand des nächsten Laufs. Ein fehlender Cache
      # darf nicht als "keine Änderung" durchgewunken werden.
      - name: Trading-Radar-Thesenregister-Snapshot und Integritaetsmanifest pruefen
        id: trading-radar-thesen-snapshot
        if: ${{ always() && hashFiles('.trading_radar_thesen.json') != '' }}
        run: python trading_radar_thesen_persistence.py prepare

      - name: Trading-Radar-Thesenregister dauerhaft im Actions-Cache sichern
        if: ${{ always() && steps.trading-radar-thesen-snapshot.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            .trading_radar_thesen.json
            .trading_radar_thesen.json.manifest.json
          key: trading-radar-thesen-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # Zusaetzlicher Wiederherstellungspunkt, falls Actions-Caches fehlen oder
      # evicted wurden. Das Artifact bleibt 90 Tage verfuegbar und wird im
      # naechsten Lauf ueber die GitHub-API als Fallback gelesen.
      - name: Trading-Radar-Thesenregister als Run-Artifact archivieren
        if: ${{ always() && steps.trading-radar-thesen-snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: trading-radar-thesen-register-${{ github.run_id }}
          path: |
            .trading_radar_thesen.json
            .trading_radar_thesen.json.manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      # Auch bei kontrolliertem Gemini-Fallback sichern: erfolgreiche Split-
      # Antworten und Fehlerstatus dienen dem nächsten Lauf als Resume.
      - name: Gemini Split Resume nach Lauf sichern
        id: gemini-split-resume-save
        if: ${{ always() && hashFiles('.gemini_request_split_resume*') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            .gemini_request_split_resume.json
            .gemini_request_split_resume_done
          key: gemini-split-resume-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Cache-Speichern soll den Tageslauf nicht blockieren, sein Fehlschlag
      # darf aber nicht unbemerkt bleiben: Resume ist dann nicht garantiert.
      - name: Warnung bei nicht gespeichertem Gemini Resume
        if: ${{ always() && steps.gemini-split-resume-save.outcome == 'failure' }}
        run: echo "::warning::Gemini Split Resume konnte nicht im Actions-Cache gespeichert werden; Wiederaufnahme im nächsten Lauf ist nicht garantiert."

      # ============================================================
      # KOSTENLOSER CHATGPT-FALLBACK BEI GEMINI-TECHNISCHEM AUSFALL
      # ============================================================
      # Der Fallback erzeugt ausschließlich ein ZIP-Paket zur manuellen
      # Auswertung in ChatGPT. Es wird keine OpenAI-API verwendet und keine
      # Trading-/Setup-Logik verändert.
      - name: ChatGPT-Fallback-Paket erzeugen
        if: always()
        env:
          TRADING_RADAR_STATUS: ${{ steps.trading-radar.outputs.status }}
          TRADING_RADAR_FACHLICH_FINAL: ${{ steps.trading-radar.outputs.fachlich_final }}
          TRADING_RADAR_DATEI: ${{ steps.trading-radar.outputs.report_path }}
          TRADING_RADAR_CONTRACT_OUTCOME: ${{ steps.trading-radar-contract.outcome }}
        run: |
          set -euo pipefail

          # Ein Fehler in der verpflichtenden Vorpruefung ist kein Gemini-Ausfall.
          # Der urspruengliche Jobfehler bleibt erhalten; es wird kein Fallback-
          # Paket aus einem Lauf erzeugt, in dem der Radar-Schritt uebersprungen wurde.
          if [ "${TRADING_RADAR_CONTRACT_OUTCOME:-}" != "success" ]; then
            echo "CHATGPT_FALLBACK_ERZEUGT=false" >> "$GITHUB_ENV"
            echo "SKIP_TRADING_RADAR_UPLOAD=true" >> "$GITHUB_ENV"
            echo "SKIP_AUSWERTUNG_UPLOAD=true" >> "$GITHUB_ENV"
            echo "TRADING_RADAR_PREFLIGHT_FAILED=true" >> "$GITHUB_ENV"
            echo "::warning::Vorpruefung fehlgeschlagen (Outcome=${TRADING_RADAR_CONTRACT_OUTCOME:-missing}); Gemini-Fallback wird nicht gestartet."
            exit 0
          fi

          # Ein uebersprungener Radar-Schritt ist kein Gemini-Ausfall. Er kann
          # durch eine vorgelagerte fehlgeschlagene Regression verursacht sein.
          # In diesem Fall weder ein Fallback-Paket aus alten Dateien bauen noch
          # eine technische Gemini-Fallback-Mail ausloesen.
          if [ "${{ steps.trading-radar.outcome }}" = "skipped" ]; then
            echo "CHATGPT_FALLBACK_ERZEUGT=false" >> "$GITHUB_ENV"
            echo "SKIP_TRADING_RADAR_UPLOAD=true" >> "$GITHUB_ENV"
            echo "SKIP_AUSWERTUNG_UPLOAD=true" >> "$GITHUB_ENV"
            echo "TRADING_RADAR_UPSTREAM_SKIPPED=true" >> "$GITHUB_ENV"
            echo "::warning::Trading-Radar wurde uebersprungen; Ursache vor dem Gemini-Schritt pruefen. Kein Gemini-Fallback wird erzeugt."
            exit 0
          fi

          fallback_needed=false

          # SUCCESS + FINAL und SUCCESS + NICHT_FINAL sind technisch gültig.
          # Fallback nur bei fehlendem/ungültigem Status oder fehlendem,
          # leerem bzw. nicht in diesem Lauf erzeugtem Report.
          if [ "${TRADING_RADAR_STATUS:-}" != "SUCCESS" ] ||
             { [ "${TRADING_RADAR_FACHLICH_FINAL:-}" != "FINAL" ] && [ "${TRADING_RADAR_FACHLICH_FINAL:-}" != "NICHT_FINAL" ]; } ||
             [ -z "${TRADING_RADAR_DATEI:-}" ] ||
             [ ! -s "${TRADING_RADAR_DATEI:-/__missing_auswertung__}" ] ||
             [ ! "${TRADING_RADAR_DATEI:-/__missing_auswertung__}" -nt .trading_radar_run_started ]; then
            fallback_needed=true
          fi

          # Ein technischer Gemini-Fallback beendet gemini_auswertung.py
          # bewusst mit Exit 0. Deshalb darf ausschliesslich der Prozess-
          # Exitcode den Fallback NICHT entscheiden. Die Statusdatei ist
          # eine zusätzliche Quelle zur Erkennung des technischen Fallbacks.
          if [ "${{ steps.trading-radar.outcome }}" != "success" ]; then
            fallback_needed=true
          fi

          for f in Trading_Radar_Status*.txt; do
            if [ -f "$f" ] && grep -q "^TRADING_RADAR_STATUS=TECHNISCHER_FALLBACK$" "$f"; then
              fallback_needed=true
              break
            fi
          done

          if [ "$fallback_needed" = true ]; then
            # Sperren VOR dem Paketbau setzen: selbst wenn der optionale
            # ChatGPT-Fallback danach fehlschlägt, darf weder die alte
            # Auswertung hochgeladen noch als normale Mail verschickt werden.
            echo "CHATGPT_FALLBACK_ERZEUGT=true" >> "$GITHUB_ENV"
            # upload_to_drive.py soll weiterhin alle normalen Tagesdateien
            # hochladen, aber niemals eine alte Auswertung aus dem Workspace
            # als aktuelles Ergebnis veröffentlichen.
            echo "SKIP_TRADING_RADAR_UPLOAD=true" >> "$GITHUB_ENV"
            echo "SKIP_AUSWERTUNG_UPLOAD=true" >> "$GITHUB_ENV"
            python chatgpt_fallback_paket.py
          else
            echo "CHATGPT_FALLBACK_ERZEUGT=false" >> "$GITHUB_ENV"
            echo "SKIP_TRADING_RADAR_UPLOAD=false" >> "$GITHUB_ENV"
            echo "SKIP_AUSWERTUNG_UPLOAD=false" >> "$GITHUB_ENV"
            echo "Kein Gemini-Ausfall erkannt; kein ChatGPT-Fallback-Paket erforderlich."
          fi

      - name: ChatGPT-Fallback-Paket als Artifact sichern
        if: env.CHATGPT_FALLBACK_ERZEUGT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: chatgpt-fallback-${{ github.run_id }}
          path: CHATGPT_FALLBACK_*.zip
          if-no-files-found: error

      # Technischen Erfolg und fachlichen Status getrennt prüfen.
      # FINAL und NICHT_FINAL sind technisch gültig; NICHT_FINAL wird nur als
      # vorläufiges Artifact gesichert und nicht regulär veröffentlicht.
      # End-Snapshot nach den produktiven Scans und der Berichtserstellung.
      # Fehlende Kategorien/Quellen bleiben INCOMPLETE; unplausible Stops und
      # fehlende Positionsgrößen verhindern eine unberechtigte Risiko-Freigabe.
      - name: Trading-Radar Portfolio-/Risiko-Snapshot Ende
        if: ${{ always() }}
        run: python trading_radar_run_evidence.py end

      - name: Neue Trading-Radar technisch gültig und frisch verifizieren
        id: trading-radar-report-check
        if: always()
        env:
          TRADING_RADAR_CONTRACT_OUTCOME: ${{ steps.trading-radar-contract.outcome }}
          TRADING_RADAR_STEP_OUTCOME: ${{ steps.trading-radar.outcome }}
          TRADING_RADAR_STATUS: ${{ steps.trading-radar.outputs.status }}
          TRADING_RADAR_FACHLICH_FINAL: ${{ steps.trading-radar.outputs.fachlich_final }}
          TRADING_RADAR_DATEI: ${{ steps.trading-radar.outputs.report_path }}
        run: |
          set -euo pipefail
          if [ "${TRADING_RADAR_CONTRACT_OUTCOME:-}" != "success" ]; then
            echo "REPORT_CHECK=FAIL | Trading-Radar-Datenvertrag-Vorprüfung fehlgeschlagen (Outcome=${TRADING_RADAR_CONTRACT_OUTCOME:-missing}); Verifikation abgebrochen; kein Gemini-Fehler diagnostiziert."
            exit 1
          fi
          if [ "$TRADING_RADAR_STEP_OUTCOME" != "success" ]; then
            echo "FINALITY_CHECK=FAIL | Gemini-Schritt endete mit $TRADING_RADAR_STEP_OUTCOME"
            exit 1
          fi
          if [ "$TRADING_RADAR_STATUS" != "SUCCESS" ] ||
             { [ "$TRADING_RADAR_FACHLICH_FINAL" != "FINAL" ] && [ "$TRADING_RADAR_FACHLICH_FINAL" != "NICHT_FINAL" ]; }; then
            echo "REPORT_CHECK=FAIL | Status=$TRADING_RADAR_STATUS | FACHLICH_FINAL=$TRADING_RADAR_FACHLICH_FINAL"
            exit 1
          fi
          if [ -z "$TRADING_RADAR_DATEI" ] || [ ! -s "$TRADING_RADAR_DATEI" ]; then
            echo "FINALITY_CHECK=FAIL | neue Auswertung fehlt oder ist leer"
            exit 1
          fi
          if [ ! "$TRADING_RADAR_DATEI" -nt .trading_radar_run_started ]; then
            echo "FINALITY_CHECK=FAIL | Auswertung wurde in diesem Lauf nicht neu geschrieben"
            exit 1
          fi
          # Ein fehlgeschlagener Gate darf den erzeugten Bericht nicht als FINAL
          # stehen lassen. Erst nach erfolgreicher Gate-Pruefung bleibt FINAL moeglich.
          if ! python trading_radar_report_gate.py "$TRADING_RADAR_DATEI"; then
            sed -i 's/^TRADING_RADAR_FACHLICH_FINAL=FINAL$/TRADING_RADAR_FACHLICH_FINAL=NICHT_FINAL/' "$TRADING_RADAR_DATEI"
            echo "TRADING_RADAR_FACHLICH_FINAL=NICHT_FINAL" >> "$GITHUB_OUTPUT"
            echo "REPORT_CHECK=FAIL | Bericht auf NICHT_FINAL herabgestuft; keine regulaere Freigabe."
            exit 1
          fi
          report_status_count=$(grep -Ec '^TRADING_RADAR_FACHLICH_FINAL=(FINAL|NICHT_FINAL)$' "$TRADING_RADAR_DATEI" || true)
          if [ "$report_status_count" -ne 1 ]; then
            echo "REPORT_CHECK=FAIL | eindeutiger Fachstatusmarker fehlt/dupliziert"
            exit 1
          fi
          report_status=$(grep -E '^TRADING_RADAR_FACHLICH_FINAL=(FINAL|NICHT_FINAL)$' "$TRADING_RADAR_DATEI" | cut -d= -f2)
          if [ "$report_status" != "$TRADING_RADAR_FACHLICH_FINAL" ]; then
            echo "REPORT_CHECK=FAIL | Statusmarker im Report weicht vom Prozessoutput ab"
            exit 1
          fi
          echo "TRADING_RADAR_FACHLICH_FINAL=$report_status" >> "$GITHUB_OUTPUT"
          echo "REPORT_CHECK=PASS | frischer Bericht, acht Abschnitte und eindeutiger Status=$report_status"

      # Das Gate-Ergebnis wird erst nach dem Report-Check in den End-Snapshot
      # geschrieben. NICHT_FINAL ist ein wahrheitsgemäßer Audit-Ausgang und
      # darf die Evidence-Validierung nicht verhindern.
      - name: Trading-Radar Evidence nach Report-Gate finalisieren
        if: ${{ always() && hashFiles('trading_radar_run_evidence_start.json') != '' && hashFiles('trading_radar_run_evidence_end.json') != '' }}
        env:
          TRADING_RADAR_CONTRACT_OUTCOME: ${{ steps.trading-radar-contract.outcome }}
          TRADING_RADAR_STEP_OUTCOME: ${{ steps.trading-radar.outcome }}
          TRADING_RADAR_OHLCV_PERSISTENCE_GATE: ${{ steps.trading-radar.outputs.ohlcv_persistence_gate }}
          TRADING_RADAR_OHLCV_QUEUE_GATE: ${{ steps.trading-radar.outputs.ohlcv_queue_gate }}
          TRADING_RADAR_MARKET_FIRST_GATE: ${{ steps.trading-radar.outputs.market_first_gate }}
          TRADING_RADAR_REPORT_GATE: ${{ steps.trading-radar-report-check.outcome }}
          TRADING_RADAR_FACHLICH_FINAL: ${{ steps.trading-radar-report-check.outputs.TRADING_RADAR_FACHLICH_FINAL }}
        run: python trading_radar_run_evidence.py gate-result

      - name: Trading-Radar Evidence final validieren
        id: trading-radar-evidence-final
        if: ${{ always() && hashFiles('trading_radar_run_evidence_end.json') != '' }}
        env:
          TRADING_RADAR_CONTRACT_OUTCOME: ${{ steps.trading-radar-contract.outcome }}
          TRADING_RADAR_STEP_OUTCOME: ${{ steps.trading-radar.outcome }}
          TRADING_RADAR_OHLCV_PERSISTENCE_GATE: ${{ steps.trading-radar.outputs.ohlcv_persistence_gate }}
          TRADING_RADAR_OHLCV_QUEUE_GATE: ${{ steps.trading-radar.outputs.ohlcv_queue_gate }}
          TRADING_RADAR_MARKET_FIRST_GATE: ${{ steps.trading-radar.outputs.market_first_gate }}
          TRADING_RADAR_REPORT_GATE: ${{ steps.trading-radar-report-check.outcome }}
          TRADING_RADAR_FACHLICH_FINAL: ${{ steps.trading-radar-report-check.outputs.TRADING_RADAR_FACHLICH_FINAL }}
        run: python trading_radar_run_evidence.py validate-final

      - name: Trading-Radar Laufnachweis als Artifact sichern
        if: ${{ always() && hashFiles('trading_radar_run_evidence_start.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: trading-radar-run-evidence-${{ github.run_id }}
          path: |
            trading_radar_run_evidence_start.json
            trading_radar_run_evidence_end.json
            trading_radar_run_evidence.json
          if-no-files-found: warn
          retention-days: 90

      # Unveraenderliche Laufhistorie: jeden erzeugten Bericht mit Run-ID sichern,
      # auch wenn das Report-Gate ihn wegen NICHT_FINAL oder Strukturfehlern sperrt.
      # Das Artifact ist ein Auditbeleg, keine Freigabe zur Drive-/E-Mail-Publikation.
      - name: Trading-Radar-Laufbericht als Historien-Artifact sichern
        if: ${{ always() && steps.trading-radar.outputs.status == 'SUCCESS' && steps.trading-radar.outputs.report_path != '' }}
        uses: actions/upload-artifact@v6
        with:
          # Den FINAL-Namen ausschliesslich aus dem Gate-Schritt beziehen.
          # Bei Gate-Fehler bleibt dessen Output leer und das Artifact wird NICHT_FINAL.
          name: trading-radar-${{ steps.trading-radar-report-check.outputs.TRADING_RADAR_FACHLICH_FINAL || 'NICHT_FINAL' }}-${{ github.run_id }}
          path: ${{ steps.trading-radar.outputs.report_path }}
          if-no-files-found: warn
          retention-days: 90

      # YouTube-States erst nach bestandenem Trading-Radar-Report-Gate sichern.
      # Ein Exit 0 allein genügt nicht: bei fehlendem/ungültigem Bericht bleiben
      # neue Videos pending und werden im nächsten Lauf erneut verarbeitet.
      - name: YouTube-Marktquellen State bestätigen
        if: steps.trading-radar-report-check.outcome == 'success'
        run: python -c "from youtube_market_sources import mark_youtube_market_context_processed; mark_youtube_market_context_processed()"

      - name: Bitcoin Trading DE State speichern
        if: steps.trading-radar-report-check.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .bitcoin_youtube_state
          key: btc-youtube-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Gold/Silber YouTube State speichern
        if: steps.trading-radar-report-check.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .youtube_market_sources_state
          key: metals-youtube-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # ============================================================
      # GOOGLE DRIVE
      # ============================================================

      - name: Daten hochladen
        if: ${{ steps.trading-radar-report-check.outcome == 'success' && steps.trading-radar.outputs.fachlich_final == 'FINAL' }}
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          TRADING_RADAR_STATUS: ${{ steps.trading-radar.outputs.status }}
          TRADING_RADAR_FACHLICH_FINAL: ${{ steps.trading-radar.outputs.fachlich_final }}
          TRADING_RADAR_DATEI: ${{ steps.trading-radar.outputs.report_path }}
          TRADING_RADAR_REPORT_CHECK_OUTCOME: ${{ steps.trading-radar-report-check.outcome }}
        run: python upload_to_drive.py

      # ============================================================
      # E-MAIL
      # ============================================================

      - name: Trading-Radar per E-Mail versenden (FINAL oder klar markiertes NICHT_FINAL)
        # FINAL wird nur nach bestandenem Report-Gate regulär versendet.
        # Ein technisch erzeugter NICHT_FINAL-Bericht wird trotzdem zugestellt,
        # damit Fehler sichtbar sind; er bleibt klar als nicht freigegeben markiert.
        if: ${{ always() && steps.trading-radar.outcome == 'success' && steps.trading-radar.outputs.status == 'SUCCESS' && (steps.trading-radar.outputs.fachlich_final == 'FINAL' || steps.trading-radar.outputs.fachlich_final == 'NICHT_FINAL') && env.CHATGPT_FALLBACK_ERZEUGT != 'true' && (steps.trading-radar.outputs.fachlich_final == 'NICHT_FINAL' || steps.trading-radar-report-check.outcome == 'success') }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
          TRADING_RADAR_STATUS: ${{ steps.trading-radar.outputs.status }}
          TRADING_RADAR_FACHLICH_FINAL: ${{ steps.trading-radar.outputs.fachlich_final }}
          TRADING_RADAR_DATEI: ${{ steps.trading-radar.outputs.report_path }}
          TRADING_RADAR_REPORT_CHECK_OUTCOME: ${{ steps.trading-radar-report-check.outcome }}
        run: python send_mail.py

      # Bei einem technischen Gemini-Ausfall wird KEINE normale Auswertung
      # verschickt. Stattdessen erhält der Nutzer ausdrücklich eine technische
      # Fehler-/Fallback-Mail mit Statusdatei und dem erzeugten ChatGPT-Paket.
      - name: Technischen Gemini-Fallback per E-Mail melden
        if: ${{ always() && env.CHATGPT_FALLBACK_ERZEUGT == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: |
          python - <<'PY'
          import glob
          import mimetypes
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          # Der Trading-Radar erzeugt den technischen Status unter diesem Namen.
          # Den alten Namen weiterhin akzeptieren, damit ältere Projektstände laufen.
          status_files = sorted(
              glob.glob("Gemini_Fallback_Status_*.txt")
              + glob.glob("Trading_Radar_Status*.txt")
          )
          if not status_files:
              raise SystemExit(
                  "FEHLER: Weder Gemini_Fallback_Status_*.txt noch "
                  "Trading_Radar_Status*.txt gefunden; keine Statusdatei fuer Fallback-Mail."
              )

          status_file = Path(status_files[-1])
          packages = sorted(glob.glob("CHATGPT_FALLBACK_*.zip"))
          if not packages:
              raise SystemExit("FEHLER: ChatGPT-Fallback-Mail nicht versendet; Fallback-ZIP fehlt.")

          msg = EmailMessage()
          msg["Subject"] = "TECHNISCHER GEMINI-FALLBACK – Auswertung nicht erzeugt"
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["MAIL_EMPFAENGER"]
          msg.set_content(
              "Technischer Gemini-Fallback im Trading-Radar-Lauf.\n\n"
              "Trading-Radar konnte keine gueltige Auswertung erzeugen. Details stehen in der Statusdatei.\n"
              "Es wurde deshalb bewusst KEINE normale Auswertung per E-Mail verschickt.\n\n"
              f"Technischer Status: {status_file.name}\n"
              f"Fallback-Paket: {Path(packages[-1]).name}\n\n"
              "Bitte Statusdatei und Fallback-Paket pruefen und das Paket fuer die manuelle ChatGPT-Auswertung verwenden."
          )

          for filename in [status_file, *[Path(x) for x in packages[-1:]]]:
              data = filename.read_bytes()
              ctype, _ = mimetypes.guess_type(str(filename))
              maintype, subtype = (ctype or "application/octet-stream").split("/", 1)
              msg.add_attachment(data, maintype=maintype, subtype=subtype, filename=filename.name)

          host = os.environ["SMTP_HOST"]
          port = int(os.environ.get("SMTP_PORT", "587"))
          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]

          with smtplib.SMTP(host, port, timeout=30) as smtp:
              smtp.starttls()
              smtp.login(user, password)
              smtp.send_message(msg)
          print(f"Technische Gemini-Fallback-Mail versendet: {status_file.name}")
          PY
