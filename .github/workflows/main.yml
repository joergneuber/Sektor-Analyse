name: tägliche Analyse Sektoren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1-5'

concurrency:
  group: btc-50w-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # BTC 50W-SMA: persistent state so a weekend cross is delivered by
      # the first regular Monday analysis and is not re-reported later.
      - name: BTC 50W-SMA State wiederherstellen
        id: btc-50w-state-restore
        uses: actions/cache/restore@v4
        with:
          path: .btc_50w_sma_state
          key: btc-50w-sma-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            btc-50w-sma-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas google-auth-oauthlib google-api-python-client google-auth-httplib2 groq yfinance scipy google-genai requests lxml

      - name: Offene Positionen aktualisieren
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python positionen_tracker.py

      # Live-Benchmark gegen iShares Core MSCI World (EUNL.DE),
      # Stichtag 07.08.2026. Kein Backtest: verarbeitet ausschließlich
      # die echte Positionen-Historie aus Offene_Positionen.csv.
      - name: Live-Benchmark gegen MSCI World aktualisieren
        run: python performance_benchmark.py

      - name: Einzel-Check-Beobachtungsliste aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python beobachtungsliste_sync.py

      - name: Beobachtungsliste täglich erneut prüfen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python einzel_check.py --beobachtungsliste

      - name: Analyse ausführen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python analyse.py

      # State erst NACH erfolgreicher analyse.py sichern. So kann ein
      # Cross nicht als "gemeldet" verloren gehen, falls die Analyse vorher
      # abbricht. Benchmark-Snapshots konsumieren den Cross ausdrücklich nicht.
      - name: BTC 50W-SMA State speichern
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .btc_50w_sma_state
          key: btc-50w-sma-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Trendwende-Scan ausführen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python trendwende_scanner.py

      - name: Edelmetalle-Scan ausführen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python edelmetalle_scanner.py

      - name: Short-Scan nachholen falls heute nicht gelaufen
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python short_scan_catchup.py

      - name: Langfrist-Scan nachholen falls diese Woche nicht gelaufen
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python langfrist_scan_catchup.py

      # ============================================================
      # MAKRO-DATENPAKET
      # Cache-Version bewusst auf v5 erhöht.
      # Dadurch wird der bisherige v4-Cache NICHT übernommen.
      # ============================================================

      - name: Persistenten Makro-Cache wiederherstellen
        id: macro-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .macro_cache
          key: nmm-macro-cache-v5-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nmm-macro-cache-v5-${{ runner.os }}-

      - name: Makro-Datenpaket erstellen
        continue-on-error: true
        run: python makro_szenario.py

      - name: Persistenten Makro-Cache explizit speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .macro_cache
          key: nmm-macro-cache-v5-${{ runner.os }}-${{ github.run_id }}

      - name: Cache-Diagnose
        if: always()
        run: |
          echo "MACRO_CACHE_RESTORE_HIT=${{ steps.macro-cache-restore.outputs.cache-hit }}"
          echo "MACRO_CACHE_DIR_EXISTS=$(test -d .macro_cache && echo YES || echo NO)"
          echo "MACRO_CACHE_FILE_EXISTS=$(test -f .macro_cache/macro_cache.json && echo YES || echo NO)"

          if [ -f .macro_cache/macro_cache.json ]; then
            echo "MACRO_CACHE_SIZE=$(wc -c < .macro_cache/macro_cache.json)"
          fi

      # ============================================================
      # GEMINI-AUSWERTUNG
      # ============================================================

      # Bitcoin Trading DE: State nur für den regulären Hauptlauf.
      # Die Benchmark-Workflows lesen diesen State nicht schreibend.
      - name: Bitcoin Trading DE State wiederherstellen
        id: btc-youtube-state-restore
        uses: actions/cache/restore@v4
        with:
          path: .bitcoin_youtube_state
          key: btc-youtube-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            btc-youtube-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Gemini-Auswertung erstellen
        id: gemini-auswertung
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python gemini_auswertung.py

      # YouTube-State erst sichern, wenn die Gemini-Auswertung tatsächlich
      # erfolgreich erstellt wurde. Bei einem Fehler bleiben neue Videos
      # pending und werden beim nächsten Lauf erneut versucht.
      - name: Bitcoin Trading DE State speichern
        if: steps.gemini-auswertung.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .bitcoin_youtube_state
          key: btc-youtube-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      # ============================================================
      # GOOGLE DRIVE
      # ============================================================

      - name: Daten hochladen
        if: always()
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python upload_to_drive.py

      # ============================================================
      # E-MAIL
      # ============================================================

      - name: Auswertung per E-Mail versenden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
        run: python send_mail.py