name: TEST - TE ISM Services PMI Diagnose v1

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install requests
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check requests

      - name: Verify files
        run: |
          test -f makro_szenario.py
          test -f test_te_ism_services_pmi_diagnose_v1.py
          python -m py_compile makro_szenario.py
          python -m py_compile test_te_ism_services_pmi_diagnose_v1.py

      - name: Run PMI release-date diagnosis
        run: |
          python test_te_ism_services_pmi_diagnose_v1.py
