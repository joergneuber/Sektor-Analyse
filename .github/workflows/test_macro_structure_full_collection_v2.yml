name: Macro Structure Full Collection Test V2

on:
  workflow_dispatch:

jobs:
  macro-structure-full-collection-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify files
        run: |
          test -f makro_szenario.py
          test -f test_macro_structure_full_collection_v2.py
          echo "FILES=GREEN"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas lxml requests

      - name: Verify Python syntax
        run: |
          python -m py_compile makro_szenario.py
          python -m py_compile test_macro_structure_full_collection_v2.py

      - name: Run complete collection test
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python test_macro_structure_full_collection_v2.py

      - name: Upload complete test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-structure-full-collection-v2
          path: .macro_structure_test/
          if-no-files-found: warn
