
name: OHLCV Release-Datenbank Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
  NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json

jobs:
  diagnose-release-db:
    name: Echte Release-Datenbank prüfen (read-only Quelle)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Diagnose-Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pandas<3.1" exchange-calendars yfinance pytest

      - name: Paket-2-Code vor Datenbankdownload verifizieren
        run: |
          set -euo pipefail
          test -s historical_ohlcv.py
          test -s analyse.py
          test -s diagnose_historical_ohlcv_release.py
          grep -q "def _analyse_trading_day_gaps" historical_ohlcv.py
          grep -q "def audit_snapshot" historical_ohlcv.py
          grep -q "def collect_invalid_candle_details" diagnose_historical_ohlcv_release.py
          grep -q "def collect_missing_instrument_details" diagnose_historical_ohlcv_release.py
          test -s ohlcv_invalid_crosscheck.py
          grep -q "def run_crosscheck" ohlcv_invalid_crosscheck.py

      - name: Diagnose-Code und Regressionstests pruefen
        run: python -m pytest -q tests/test_diagnose_historical_ohlcv_release.py tests/test_ohlcv_invalid_crosscheck.py

      - name: Echte OHLCV-Datenbank aus Release laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download historical-ohlcv \
            --repo "$GITHUB_REPOSITORY" \
            --pattern historical_ohlcv.sqlite \
            --dir .
          gh release download historical-ohlcv \
            --repo "$GITHUB_REPOSITORY" \
            --pattern historical_ohlcv_universe.json \
            --dir . || echo "WARNUNG: Optionales Universe-Asset nicht vorhanden; analyse.py wird als Universe-Quelle verwendet."
          test -s historical_ohlcv.sqlite
          ls -lh historical_ohlcv.sqlite

      - name: Datenbankintegrität, Schema, Handelstagslücken und Ressourcen prüfen
        id: diagnose
        env:
          PYTHONPATH: .
        run: python diagnose_historical_ohlcv_release.py

      - name: INVALID-Kerzen mit Yahoo repair und Stooq abgleichen (read-only)
        if: steps.diagnose.outcome == 'success'
        env:
          PYTHONPATH: .
          NMM_OHLCV_SOURCE_TIMEOUT: "25"
          NMM_OHLCV_SOURCE_PAUSE: "0.15"
        run: python ohlcv_invalid_crosscheck.py

      - name: Diagnosebericht immer hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: historical-ohlcv-release-diagnostic-${{ github.run_id }}
          path: |
            historical_ohlcv_release_diagnostic.json
            OHLCV_Gap_Detail.csv
            OHLCV_Gap_Ursachen.json
            OHLCV_Gap_Report.md
            OHLCV_Invalid_Detail.csv
            OHLCV_Invalid_Zusammenfassung.json
            OHLCV_Missing_Instruments.csv
            OHLCV_Quality_Report.md
            OHLCV_Invalid_Quellenvergleich.csv
            OHLCV_Invalid_Quellenvergleich.json
            OHLCV_Invalid_Quellenvergleich.md
          if-no-files-found: warn
          retention-days: 30
