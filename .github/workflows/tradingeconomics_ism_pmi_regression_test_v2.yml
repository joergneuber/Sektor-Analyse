name: TE ISM PMI Regression Test v2

on:
  workflow_dispatch:

jobs:
  pmi-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify isolated test
        run: |
          test -f tradingeconomics_ism_pmi_regression_test_v2.py
          python -m py_compile tradingeconomics_ism_pmi_regression_test_v2.py

      - name: Run PMI regression test
        run: |
          python tradingeconomics_ism_pmi_regression_test_v2.py
