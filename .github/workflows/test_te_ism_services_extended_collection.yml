name: Macro Structure Full Collection Test

on:
  workflow_dispatch:

jobs:
  macro-structure-full-collection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify files
        run: |
          test -f makro_szenario.py
          test -f test_macro_structure_full_collection.py
          echo "FILES=GREEN"
          ls -lh makro_szenario.py test_macro_structure_full_collection.py

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pandas lxml requests yfinance openpyxl

      - name: Verify syntax
        run: |
          python -m py_compile makro_szenario.py
          python -m py_compile test_macro_structure_full_collection.py

      - name: Run complete macro collection
        run: |
          python test_macro_structure_full_collection.py

      - name: Upload complete collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-structure-full-collection
          path: .macro_structure_test/
          if-no-files-found: ignore
