name: Short-Scan früh

on:
  # Ermöglicht dir, den Job jederzeit manuell per Klick im Browser zu starten
  workflow_dispatch:
  schedule:
    # 00:53 UTC entspricht 02:53 Uhr MESZ (Sommerzeit) - nicht exakt 04:00
    # Uhr (bewusst keine volle Stunde, siehe main.yml für dieselbe
    # Begründung), aber nah genug am gewünschten ~4-Uhr-Fenster. Läuft
    # deutlich vor main.yml (04:17 MESZ), damit gemini_auswertung.py dort
    # die Short-Dateien schon fertig aus Drive nachladen kann.
    - cron: '53 0 * * 1-5'

jobs:
  short-scan:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py==0.45.0 "pandas<3.1" exchange-calendars google-auth-oauthlib google-api-python-client google-auth-httplib2 groq yfinance scipy requests

      - name: Alpaca-Split-Adjustment-Vertrag pruefen
        run: python -m unittest tests.test_alpaca_split_adjustment_contract

      # Verhindert eine erneute unkontrollierte Pandas-nsmallest-Exception,
      # wenn die Datenqualitaet keine numerischen Sektor-Scores liefert.
      - name: Short-Scanner Berechnungs- und Sektorauswahl-Regressionstests
        run: |
          python -m unittest discover -s tests -p "test_short_scanner_sector_selection.py"
          python -m unittest discover -s tests -p "test_short_scanner_calculations.py"
          python -m unittest discover -s tests -p "test_short_scanner_adjustment_and_swing_diagnostics.py"
          python -m unittest discover -s tests -p "test_short_scanner_us_data_fallback.py"

      - name: Short-Scan ausführen
        # Läuft NACH analyse.py-Import (siehe short_scanner.py) - braucht
        # deshalb auch GROQ_API_KEY, obwohl short_scanner.py selbst kein
        # Groq nutzt: der Import von analyse.py führt dessen kompletten
        # Modul-Code aus, inkl. der Zeile "client = Groq(...)" (gleiche
        # Erfahrung wie beim Trendwende-Scanner). GEÄNDERT (27.07.2026):
        # requests jetzt auch noetig, da analyse.py fuer die neue
        # Zinskurve (get_zinskurve_fred) FRED-Daten per requests abruft.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python short_scanner.py

      - name: Daten hochladen
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python upload_to_drive.py
