name: TE ISM Services Production Patch

on:
  workflow_dispatch:

jobs:
  test-te-ism-services-production-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml requests

      - name: Verify production file exists
        run: test -f makro_szenario.py

      - name: Verify production syntax
        run: python -m py_compile makro_szenario.py

      - name: Verify master test syntax
        run: python -m py_compile test_te_ism_services_production_patch_1787941269.py

      - name: Run large non-aborting master test
        run: python test_te_ism_services_production_patch_1787941269.py

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-ism-services-master-diagnostic
          path: |
            .te_services_*_debug.html
            .macro_cache/macro_cache.json
          if-no-files-found: ignore
