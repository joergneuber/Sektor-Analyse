name: TE ISM Services Sequential Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose-te-ism-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml requests

      - name: Verify target exists
        run: test -f makro_szenario.py

      - name: Verify diagnostic syntax
        run: python -m py_compile test_te_ism_services_diagnostic_1787941269.py

      - name: Run complete non-aborting diagnostic
        run: python test_te_ism_services_diagnostic_1787941269.py
