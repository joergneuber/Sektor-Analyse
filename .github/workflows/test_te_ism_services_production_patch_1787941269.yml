name: TE ISM Services Production Patch - Sequential Diagnostic

on:
  workflow_dispatch:

jobs:
  test-te-ism-services-production-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install production-patch diagnostic dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml requests yfinance

      - name: Verify target exists
        run: test -f makro_szenario.py

      - name: Verify production-patch diagnostic syntax
        run: python -m py_compile test_te_ism_services_production_patch_1787941269.py

      - name: Run complete non-aborting production-patch diagnostic
        run: python test_te_ism_services_production_patch_1787941269.py
