name: TE ISM PMI Raw Diagnostic v3

on:
  workflow_dispatch:

jobs:
  pmi-raw-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify isolated diagnostic
        run: |
          test -f tradingeconomics_ism_pmi_raw_diagnostic_v3.py
          python -m py_compile tradingeconomics_ism_pmi_raw_diagnostic_v3.py

      - name: Run PMI raw HTML diagnostic
        run: |
          python tradingeconomics_ism_pmi_raw_diagnostic_v3.py
