name: Free Macro Calendar Candidate Test

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1-5"

jobs:
  calendar-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test free calendar candidates
        run: |
          python tests/test_free_calendar_candidates.py
