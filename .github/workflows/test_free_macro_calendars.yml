name: Free Macro Calendar Sources Test

on:
  workflow_dispatch:
  schedule:
    - cron: "27 6 * * 1-5"

jobs:
  free-macro-calendar-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test free calendar sources
        run: |
          python tests/test_free_macro_calendars.py
