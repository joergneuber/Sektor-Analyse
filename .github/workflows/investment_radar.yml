name: Investment Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1-5"

permissions:
  contents: write

jobs:
  investment-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Investment Radar ausführen
        run: python investment_radar.py

      - name: Radar-Bericht committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update Investment Radar"
            git push
          else
            echo "Keine Änderungen am Radar-Bericht."
          fi
