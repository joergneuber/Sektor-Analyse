name: TEST - TE ISM Services Last Patch v1

on:
  workflow_dispatch:

jobs:
  isolated-patch-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check requests pandas lxml

      - name: Verify files and syntax
        run: |
          test -f makro_szenario.py
          test -f test_te_ism_services_last_patch_v1.py
          python -m py_compile makro_szenario.py
          python -m py_compile test_te_ism_services_last_patch_v1.py

      - name: Run isolated Last-column patch test
        run: |
          python test_te_ism_services_last_patch_v1.py
