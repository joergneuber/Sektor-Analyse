name: HEBELTRADER Kandidaten + Einzel-Check

on:
  workflow_dispatch:
  # GitHub Actions unterstützt eine IANA-Zeitzone direkt.
  # Damit bleibt 09:30 Europe/Berlin automatisch auch bei MESZ/MEZ korrekt.
  schedule:
    - cron: '30 9 * * 1-5'
      timezone: 'Europe/Berlin'

concurrency:
  group: hebeltrader-einzel-check
  cancel-in-progress: false

jobs:
  hebeltrader-check:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas google-auth-oauthlib google-api-python-client google-auth-httplib2 groq yfinance scipy google-genai requests lxml xlrd

      # Die bestehende Einzel-Check-Watchlist bleibt Teil des normalen
      # Einzel-Checks und wird vor dem HEBELTRADER-Lauf geladen.
      - name: Einzel-Check-Beobachtungsliste aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python beobachtungsliste_sync.py

      # State + letzter erfolgreicher HEBELTRADER-Check. Fehlt die Datei,
      # verarbeitet der Scanner die aktuellste Ausgabe erstmalig.
      - name: HEBELTRADER-State aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python hebeltrader_sync.py

      - name: Neue HEBELTRADER-Ausgabe forensisch prüfen und Einzel-Check ausführen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python hebeltrader_einzel_check.py

      # Erst nach erfolgreichem Kandidaten-/Einzel-Check wird der neue State
      # nach Drive geschrieben. Bei Fehlern bleibt der letzte gute Stand erhalten.
      - name: HEBELTRADER-Ergebnis und Watchlist in Drive sichern
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python upload_to_drive.py
