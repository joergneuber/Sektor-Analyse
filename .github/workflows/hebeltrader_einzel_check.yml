name: HEBELTRADER Kandidaten + Einzel-Check

on:
  workflow_dispatch:
    inputs:
      fallback:
        description:   'Fallback-Abruf durch cron-job.org'
        required: false  
        default: false    
        type: boolean        
  schedule:
    - cron: '30 9 * * 1-5'
      timezone: 'Europe/Berlin'

permissions:
  actions: read
  contents: read

concurrency:
  group: hebeltrader-einzel-check
  cancel-in-progress: false

jobs:
  fallback-check:
    runs-on: ubuntu-latest
    outputs:
      run_check: ${{ steps.check.outputs.run_check }}
    steps:
      - name: Prüfen ob regulärer 09:30-Run bereits gestartet wurde
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.fallback }}" != "true" ]; then
            echo "run_check=true" >> "$GITHUB_OUTPUT"
            echo "Normaler Workflow-Aufruf – Prüfung nicht erforderlich."
            exit 0
          fi

          TODAY=$(date -u +%Y-%m-%d)

          RUNS=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hebeltrader_einzel_check.yml/runs?event=schedule&created=${TODAY}T00:00:00Z")

          COUNT=$(echo "$RUNS" | jq '.total_count')

          if [ "$COUNT" -gt 0 ]; then
            echo "Heute wurde bereits ein regulärer Schedule-Run gestartet."
            echo "run_check=false" >> "$GITHUB_OUTPUT"
          else
            echo "Kein regulärer Schedule-Run vorhanden – Fallback darf ausgeführt werden."
            echo "run_check=true" >> "$GITHUB_OUTPUT"
          fi

  hebeltrader-check:
    needs: fallback-check
    if: needs.fallback-check.outputs.run_check == 'true'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas google-auth-oauthlib google-api-python-client google-auth-httplib2 groq yfinance scipy google-genai requests lxml xlrd

      # Die bestehende Einzel-Check-Watchlist bleibt Teil des normalen
      # Einzel-Checks und wird vor dem HEBELTRADER-Lauf geladen.
      - name: Einzel-Check-Beobachtungsliste aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python beobachtungsliste_sync.py

      # State + letzter erfolgreicher HEBELTRADER-Check. Fehlt die Datei,
      # verarbeitet der Scanner die aktuellste Ausgabe erstmalig.
      - name: HEBELTRADER-State aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python hebeltrader_sync.py

      - name: Neue HEBELTRADER-Ausgabe forensisch prüfen und Einzel-Check ausführen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python hebeltrader_einzel_check.py

      # Erst nach erfolgreichem Kandidaten-/Einzel-Check wird der neue State
      # nach Drive geschrieben. Bei Fehlern bleibt der letzte gute Stand erhalten.
      - name: HEBELTRADER-Ergebnis und Watchlist in Drive sichern
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          UPLOAD_HEBELTRADER: '1'
        run: python upload_to_drive.py
