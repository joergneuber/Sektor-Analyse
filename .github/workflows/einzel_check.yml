name: Einzel-Check (beliebige Ticker)

on:
  # Bewusst NUR manuell: externe Empfehlungen werden hier gegen
  # die eigene Systematik geprüft. Die bestehende B/C-Beobachtungsliste
  # wird vor jedem Lauf automatisch aus Google Drive geladen.
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker, durch Leerzeichen getrennt (EU mit Suffix, z.B. VOW3.DE)'
        required: true
        default: 'GM F CMI BWA PCAR'

jobs:
  einzel-check:
    # Queue-Producer nur auf main; andere Branches werden vom produktiven
    # Hauptlauf bewusst nicht importiert.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py==0.45.0 pandas google-auth-oauthlib google-api-python-client google-auth-httplib2 groq yfinance scipy google-genai requests

      # NMM_OHLCV_PENDING_QUEUE_SCHEMA: 1
      # Pro Run wird eine eigene, schema-validierte Pending-Queue angelegt.
      # Auch eine leere Queue wird archiviert: fehlendes Artifact ist dadurch
      # von "keine neuen Ticker" unterscheidbar.
      - name: OHLCV Pending-Queue initialisieren
        run: python historical_ohlcv_pending_queue.py init

      # ----------------------------------------------------------
      # WICHTIG:
      # Vor dem Einzel-Check die bestehende B/C-Beobachtungsliste
      # aus Google Drive in den frischen GitHub-Runner laden.
      # Dadurch werden Titel aus einem früheren Check automatisch
      # erneut geprüft, auch wenn sie heute nicht manuell angegeben
      # wurden.
      # ----------------------------------------------------------
      - name: Beobachtungsliste aus Drive laden
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python beobachtungsliste_sync.py

      - name: Ticker gegen alle drei Strategien prüfen
        id: einzel-check
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python einzel_check.py ${{ github.event.inputs.ticker }}

      # Die Queue wird auch bei einem fehlgeschlagenen Einzel-Check als
      # Run-Artifact gesichert. Erfolgreich geladene Ticker werden nachgeholt;
      # ein fehlgeschlagener neuester Scanner-Attempt bleibt im Hauptlauf PARTIAL.
      - name: OHLCV Pending-Queue finalisieren
        if: always()
        env:
          NMM_PENDING_QUEUE_PRODUCER_OUTCOME: ${{ steps.einzel-check.outcome }}
          NMM_PENDING_QUEUE_REGISTRATION_FAILED: ${{ steps.einzel-check.outputs.queue_registration_failed || 'false' }}
          NMM_PENDING_QUEUE_ERROR_TICKER: ${{ steps.einzel-check.outputs.queue_registration_error_ticker || '' }}
        run: python historical_ohlcv_pending_queue.py finalize --outcome "$NMM_PENDING_QUEUE_PRODUCER_OUTCOME"

      - name: Pending-Queue als Run-Artifact sichern
        id: pending-queue-artifact
        if: ${{ always() && hashFiles('historical_ohlcv_pending_queue.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: historical-ohlcv-pending-${{ github.run_id }}-${{ github.run_attempt }}
          path: historical_ohlcv_pending_queue.json
          if-no-files-found: error
          retention-days: 90

      # Die von einzel_check.py aktualisierte JSON wird anschließend
      # wieder nach Google Drive gespiegelt.
      - name: Einzel-Check-Beobachtungsliste in Drive sichern
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python upload_to_drive.py
