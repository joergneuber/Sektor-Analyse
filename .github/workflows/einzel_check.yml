name: Einzel-Check (beliebige Ticker)

on:
  # Bewusst NUR manuell und mit Eingabefeld: dieser Check dient dazu, eine
  # externe Empfehlung (Boersenbrief o.ae.) durch die eigene Systematik zu
  # schicken - er umgeht dabei den taeglichen Rotations-Filter.
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker, durch Leerzeichen getrennt (EU mit Suffix, z.B. VOW3.DE)'
        required: true
        default: 'GM F CMI BWA PCAR'

jobs:
  einzel-check:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        # Gleiche Liste wie main.yml: einzel_check.py importiert analyse.py,
        # trendwende_scanner.py und short_scanner.py.
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas google-auth-oauthlib google-api-python-client google-auth-httplib2 groq yfinance scipy google-genai requests

      - name: Ticker gegen alle drei Strategien prüfen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python einzel_check.py ${{ github.event.inputs.ticker }}

      - name: Einzel-Check-Beobachtungsliste in Drive sichern
        # Die JSON ist die persistente Quelle für die B/C-Beobachtungsliste.
        # Sie wird nach jedem manuellen Einzel-Check aktualisiert und hier
        # in denselben Drive-Ordner wie die übrigen Trading-Dateien gespiegelt.
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: python upload_to_drive.py
