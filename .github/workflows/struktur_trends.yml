name: Struktur-Trends Cache

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Auszuführender Test-/Laufmodus"
        required: true
        default: cache
        type: choice
        options:
          - cache
          - iea_forensic
          - iea_browser
          - eurostat_forensic
  schedule:
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

jobs:
  update-struktur-trends:
    if: ${{ github.event_name == 'schedule' || inputs.run_mode == 'cache' }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Benötigte Python-Bibliotheken installieren
        run: |
          python -m pip install --disable-pip-version-check --no-input openpyxl google-auth google-api-python-client

      - name: Struktur-Trends Cache aktualisieren
        working-directory: struktur_trends
        run: |
          python struktur_trends.py

      - name: Struktur-Trend-Briefing gezielt nach Google Drive hochladen
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          BRIEFING_FILE="$(find . -maxdepth 1 -type f -name 'Struktur_Trend_Briefing(*).txt' -print -quit)"
          if [ -z "$BRIEFING_FILE" ]; then
            echo "FEHLER: Kein Struktur_Trend_Briefing im Hauptverzeichnis gefunden."
            exit 1
          fi
          BRIEFING_NAME="$(basename "$BRIEFING_FILE")"
          echo "Gefunden: $BRIEFING_NAME"
          python -c 'import sys; from upload_to_drive import get_drive_service, upload_file; filename=sys.argv[1]; folder_id="1BaKFsiqVVOP3uOrYDYXV4PPnFnWZBnjL"; service=get_drive_service(); upload_file(filename, folder_id, service); print(f"DRIVE-TEST: {filename} gezielt hochgeladen.")' "$BRIEFING_NAME"


      - name: Cache speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add struktur_trends/struktur_trends_cache.json
          git diff --cached --quiet || git commit -m "Update structural trends cache"
          git push

  iea-forensic-discovery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'iea_forensic' }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: IEA-SDMX-Abhängigkeiten installieren
        run: |
          python -m pip install --disable-pip-version-check --no-input requests

      - name: IEA MESGEN/MESBAL SDMX Dataflow Discovery
        working-directory: struktur_trends
        run: |
          python iea_sdmx_dataflow_discovery.py \
            --output iea_sdmx_dataflow_discovery \
            --timeout 25

      - name: IEA-SDMX-Dataflow-Ergebnisse als Artifact speichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iea-sdmx-dataflow-discovery
          path: struktur_trends/iea_sdmx_dataflow_discovery/
          if-no-files-found: warn
          retention-days: 14

  eurostat-forensic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'eurostat_forensic' }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Eurostat-SDMX-Abhängigkeiten installieren
        run: |
          python -m pip install --disable-pip-version-check --no-input requests

      - name: Eurostat Forensik / finaler Balance-Test
        working-directory: struktur_trends
        run: |
          python eurostat_forensik_gezielte_reihen.py

      - name: Eurostat Forensik als Artifact speichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eurostat-forensik-gezielte-reihen
          path: |
            struktur_trends/eurostat_forensik_gezielte_reihen.py
          if-no-files-found: warn
          retention-days: 14

  iea-browser-forensics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'iea_browser' }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Playwright und Chromium installieren
        run: |
          python -m pip install --disable-pip-version-check --no-input playwright
          python -m playwright install --with-deps chromium

      - name: IEA .Stat Browser Forensik
        working-directory: struktur_trends
        run: |
          python iea_stat_browser_forensics.py

      - name: IEA .Stat Browser Forensik als Artifact speichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iea-stat-browser-forensics
          path: struktur_trends/iea_stat_browser_forensics/
          if-no-files-found: warn
          retention-days: 14
