name: Struktur-Trends Cache

on:
  workflow_dispatch:
  schedule:
    # Separater Lauf, später in den bestehenden Workflow integrierbar.
    # Montag bis Freitag um 06:30 UTC.
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

jobs:
  update-struktur-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Struktur-Trends Cache aktualisieren
        working-directory: struktur_trends
        run: |
          python struktur_trends.py

      - name: Cache speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add struktur_trends/struktur_trends_cache.json
          git diff --cached --quiet || git commit -m "Update structural trends cache"
          git push
