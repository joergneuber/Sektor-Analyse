name: Makro Repair Validation

on:
  workflow_dispatch:

jobs:
  validate-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml html5lib yfinance

      - name: Makro-Reparatur validieren
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python makro_repair_validation.py
