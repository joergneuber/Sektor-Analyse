name: Optionsschein-Test

on:
  workflow_dispatch:

jobs:
  optionsschein-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Testdateien prüfen
        run: |
          test -f Test/Offene_Positionen_TEST.xlsx
          test -f Test/optionsschein_kurse.py
          test -f Test/test_optionsschein_kurse.py
          test -f Test/test_optionsschein_live.py

      - name: Python-Syntax prüfen
        run: |
          python -m py_compile Test/optionsschein_kurse.py
          python -m py_compile Test/test_optionsschein_kurse.py
          python -m py_compile Test/test_optionsschein_live.py

      - name: Deterministischen Offline-Test ausführen
        working-directory: Test
        run: python test_optionsschein_kurse.py

      - name: Live-Integrationstest Börse Stuttgart
        working-directory: Test
        run: python test_optionsschein_live.py
