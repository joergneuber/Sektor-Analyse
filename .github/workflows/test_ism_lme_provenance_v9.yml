name: ISM LME Provenance Extraction V9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ism-lme-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pandas lxml

      - name: Validate test code
        run: |
          python -m py_compile test_ism_lme_provenance_v9.py
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("test_ism_lme_provenance_v9.py").read_text(encoding="utf-8"))
          print("V9_SYNTAX=GREEN")
          PY

      - name: Run V9 broad value extraction
        shell: bash
        run: |
          set +e
          python test_ism_lme_provenance_v9.py
          rc=$?
          echo "V9_TEST_EXIT=$rc"
          exit 0

      - name: Show result matrix
        if: always()
        shell: bash
        run: |
          echo "=== VALUE MATRIX ==="
          cat ism_lme_provenance_v9/provenance_matrix.csv 2>/dev/null || true
          echo "=== SUMMARY ==="
          cat ism_lme_provenance_v9/summary.json 2>/dev/null || true
          echo "=== REPORT TAIL ==="
          tail -n 120 ism_lme_provenance_v9/report.txt 2>/dev/null || true

      - name: Upload V9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ism-lme-provenance-v9
          path: ism_lme_provenance_v9/
          if-no-files-found: warn
