name: Profit All 7 Index Test

on:
  workflow_dispatch:

jobs:
  profit-all-7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Profit all 7 index test
        env:
          PROFIT_API_KEY: ${{ secrets.PROFIT_API_KEY }}
        run: |
          python profit_all_indexes_test.py
