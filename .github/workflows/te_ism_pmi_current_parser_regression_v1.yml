name: TE ISM PMI Current Parser Regression v1

on:
  workflow_dispatch:

jobs:
  pmi-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install parser test dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas lxml requests yfinance

      - name: Verify files
        run: |
          test -f te_ism_pmi_current_parser_regression_v1.py
          python -m py_compile te_ism_pmi_current_parser_regression_v1.py

      - name: Run current parser regression
        run: |
          python te_ism_pmi_current_parser_regression_v1.py
