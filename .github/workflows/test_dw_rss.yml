name: DW RSS isolated test

on:
  workflow_dispatch:

jobs:
  dw-rss-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run isolated DW test
        run: |
          python tests/test_dw_rss_runner.py

      - name: Upload DW diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dw-rss-diagnostics
          path: |
            dw_raw_response.txt
            dw_extracted_articles.json
