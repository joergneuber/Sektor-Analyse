name: Macro PMI ISM Multi Route V7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-pmi-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pandas lxml

      - name: Run V7 non-aborting deep dive
        shell: bash
        run: |
          set +e
          python test_macro_pmi_multi_route_v7.py
          rc=$?
          echo "V7_TEST_EXIT=$rc"
          exit 0

      - name: Validate outputs exist
        if: always()
        shell: bash
        run: |
          test -f macro_pmi_multi_route_v7/summary.json || true
          test -f macro_pmi_multi_route_v7/source_matrix.csv || true
          test -f macro_pmi_multi_route_v7/report.txt || true
          echo "V7_OUTPUT_VALIDATION_COMPLETE"

      - name: Upload V7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-pmi-multi-route-v7
          path: macro_pmi_multi_route_v7/
          if-no-files-found: warn
