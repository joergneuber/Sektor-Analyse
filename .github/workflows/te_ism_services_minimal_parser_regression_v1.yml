name: TE ISM Services Minimal Parser Regression v1

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify patch files
        run: |
          test -f te_ism_services_te_minimal_parser_patch_v1.py
          test -f test_te_ism_services_te_minimal_parser_patch_v1.py
          python -m py_compile te_ism_services_te_minimal_parser_patch_v1.py
          python -m py_compile test_te_ism_services_te_minimal_parser_patch_v1.py

      - name: Run isolated regression
        run: |
          python test_te_ism_services_te_minimal_parser_patch_v1.py
