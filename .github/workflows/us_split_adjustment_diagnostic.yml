name: US Split-Adjustment Diagnostic – Alpaca SIP vs Yahoo

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Vergleichsfenster in Kalendertagen (30–730)"
        required: true
        default: "365"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: us-split-adjustment-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  split-adjustment-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py==0.45.0 pandas yfinance exchange-calendars requests

      - name: Verifiziertes OHLCV-Release-Bundle wiederherstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
          NMM_ALLOW_OHLCV_LEGACY_MIGRATION: ${{ vars.NMM_ALLOW_OHLCV_LEGACY_MIGRATION }}
        run: bash scripts/restore_ohlcv_release_bundle.sh

      - name: Unit-Tests
        run: python -m unittest discover -s tests -p 'test_diagnose_us_split_adjustment.py' -v

      - name: Split-adjusted SIP gegen Yahoo vergleichen (read-only)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_SOURCE: analyse.py
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python diagnose_us_split_adjustment.py --lookback-days "$LOOKBACK_DAYS"

      - name: Diagnoseberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-split-adjustment-${{ github.run_id }}
          path: |
            US_Split_Adjustment_Diagnostic.json
            US_Split_Adjustment_Diagnostic.csv
            US_Split_Adjustment_Diagnostic.md
          if-no-files-found: warn
          retention-days: 30
