name: Macro PMI ISM Multi Route V8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-pmi-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pandas lxml

      - name: Syntax check
        shell: bash
        run: |
          python -m py_compile test_macro_pmi_multi_route_v8.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path("test_macro_pmi_multi_route_v8.py")
          ast.parse(p.read_text(encoding="utf-8"))
          print("V8_SYNTAX=GREEN")
          PY

      - name: Run V8 controlled deep dive
        shell: bash
        run: |
          set +e
          python test_macro_pmi_multi_route_v8.py
          rc=$?
          echo "V8_TEST_EXIT=$rc"
          # The test is deliberately non-aborting.
          exit 0

      - name: Show result
        if: always()
        shell: bash
        run: |
          echo "=== V8 RESULT FILES ==="
          find macro_pmi_multi_route_v8 -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null || true
          echo "=== V8 REPORT TAIL ==="
          tail -n 80 macro_pmi_multi_route_v8/report.txt 2>/dev/null || true

      - name: Upload V8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-pmi-multi-route-v8
          path: macro_pmi_multi_route_v8/
          if-no-files-found: warn
