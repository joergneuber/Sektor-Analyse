name: TEST - TE ISM Services v1

on:
  workflow_dispatch:

jobs:
  isolated-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            yfinance \
            requests \
            pandas \
            numpy \
            lxml \
            beautifulsoup4

      - name: Verify test files
        run: |
          test -f makro_szenario_v6_7.py
          test -f test_te_ism_services_v1.py
          python -m py_compile makro_szenario_v6_7.py
          python -m py_compile test_te_ism_services_v1.py

      - name: Run isolated TE ISM Services test
        run: |
          python test_te_ism_services_v1.py
