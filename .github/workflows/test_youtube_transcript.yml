name: Test YouTube Transcript

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcript-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install requests
        run: python -m pip install requests

      - name: Test YouTube Transcript
        run: python test_youtube_transcript.py

      - name: Upload transcript test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcript-test
          path: youtube_transcript_test.txt
          if-no-files-found: ignore
