name: Trendwende Research Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Startdatum YYYY-MM-DD (leer = gesamte DB)"
        required: false
        default: ""
      end:
        description: "Enddatum YYYY-MM-DD (leer = letzter DB-Tag)"
        required: false
        default: ""
      pivot_order:
        description: "Pivot-Bestaetigungsordnung"
        required: false
        default: "5"

jobs:
  trendwende-backtest:
    runs-on: ubuntu-latest
    # Research-Workflow liest das verifizierte Bundle; nur main.yml darf Releases schreiben.
    permissions:
      contents: read

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy yfinance alpaca-py==0.45.0 google-auth-oauthlib google-api-python-client google-auth-httplib2 groq google-genai requests lxml xlrd cme-fedwatch openpyxl pytest

      - name: Verifiziertes OHLCV-Release-Bundle wiederherstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NMM_HISTORICAL_OHLCV_DB: historical_ohlcv.sqlite
          NMM_HISTORICAL_OHLCV_DYNAMIC_UNIVERSE: historical_ohlcv_universe.json
          NMM_ALLOW_OHLCV_LEGACY_MIGRATION: ${{ vars.NMM_ALLOW_OHLCV_LEGACY_MIGRATION }}
        run: bash scripts/restore_ohlcv_release_bundle.sh

      - name: Backtest-Regressions-Unit-Tests
        run: python -m pytest -q tests/test_trendwende_backtest.py

      - name: Großer Trendwende-Varianten-Backtest
        run: |
          ARGS=""
          if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          python trendwende_backtest.py \
            --db historical_ohlcv.sqlite \
            --out trendwende_backtest \
            --pivot-order ${{ inputs.pivot_order }} \
            $ARGS

      - name: Backtest-Ergebnisse als Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: trendwende-backtest
          path: trendwende_backtest/

      - name: Kurzbericht
        run: |
          echo "=== TRENDWENDE BACKTEST ==="
          cat trendwende_backtest/trendwende_backtest_summary.csv
