name: Trading Economics ISM PMI Deep Test

on:
  workflow_dispatch:

jobs:
  pmi-deep-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify test file
        run: |
          test -f tradingeconomics_ism_pmi_deep_test_v1.py
          python -m py_compile tradingeconomics_ism_pmi_deep_test_v1.py

      - name: Run isolated PMI deep diagnostic
        run: |
          python tradingeconomics_ism_pmi_deep_test_v1.py
