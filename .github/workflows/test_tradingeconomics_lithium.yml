name: Test TradingEconomics Lithium

on:
  workflow_dispatch:

jobs:
  test-tradingeconomics-lithium:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run TradingEconomics Lithium diagnostic
        run: |
          python tests/test_tradingeconomics_lithium_runner.py
