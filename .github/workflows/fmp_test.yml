name: FMP Index Test

on:
  workflow_dispatch:

jobs:
  fmp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run FMP index test
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python fmp_index_test.py
