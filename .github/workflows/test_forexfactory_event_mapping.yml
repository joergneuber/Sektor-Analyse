name: ForexFactory Semantic Event Mapping Test

on:
  workflow_dispatch:

jobs:
  semantic-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test ForexFactory semantic event mapping
        run: |
          python tests/test_forexfactory_event_mapping.py
